<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Uw offerte · Renovion Groep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Toegangspagina offerte: server zet window.RENOVION_LOGIN vóór dit script */
:root{--navy:#0D1A2E;--ink:#0F1B2E;--ink-2:#47546B;--muted:#7A869B;--line:#E1E6EE;--surface:#fff;--surface-2:#F7F8FB;--accent:#F26A1B;--accent-ink:#C2500C;--accent-soft:#FDEDE2;--danger:#C23A2B;--ok:#1E8A5A;--bg:#0D1A2E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E7ECF4;--ink-2:#AAB6C8;--muted:#7B899F;--line:#1E2F47;--surface:#0E1A2C;--surface-2:#122136;--accent:#F7792E;--accent-ink:#FF9858;--accent-soft:#3A2312;--danger:#F0715F;--bg:#08111E}}
:root[data-theme="dark"]{--ink:#E7ECF4;--ink-2:#AAB6C8;--muted:#7B899F;--line:#1E2F47;--surface:#0E1A2C;--surface-2:#122136;--accent:#F7792E;--accent-ink:#FF9858;--accent-soft:#3A2312;--danger:#F0715F;--bg:#08111E}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100dvh;padding:24px 16px}
body::before{content:"";position:fixed;right:-140px;bottom:-140px;width:420px;height:420px;border:44px solid #F26A1B;border-radius:80px;transform:rotate(45deg);opacity:.14;pointer-events:none}
.card{position:relative;width:min(440px,100%);background:var(--surface);border-radius:20px;box-shadow:0 40px 100px rgba(0,0,0,.45);overflow:hidden}
.top{background:#0D1A2E;color:#fff;padding:26px 28px 22px;border-bottom:3px solid #F26A1B}
.brand{display:flex;align-items:center;gap:10px;font:600 20px/1 Outfit,sans-serif}
.brand svg{width:30px;height:30px;fill:none;stroke:#F26A1B;stroke-width:2.6;stroke-linejoin:round}
.brand b{color:#F26A1B;font-weight:600}
.eb{display:block;margin-top:22px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#F26A1B}
h1{margin:6px 0 0;font:600 26px/1.15 Outfit,sans-serif;text-wrap:balance}
form{padding:24px 28px 8px;display:grid;gap:14px}
p.sub{margin:0;color:var(--ink-2);font-size:14px}
label{display:grid;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;font-size:17px;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;letter-spacing:.02em}
input#code{letter-spacing:.3em;font-variant-numeric:tabular-nums;text-transform:uppercase}
input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.hint{margin:-4px 0 0;font-size:12.5px;color:var(--muted)}
button{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:13px 20px;cursor:pointer;box-shadow:0 10px 24px rgba(242,106,27,.3);margin-top:4px}
button[disabled]{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{min-height:1.4em;margin:0;font-size:13.5px;font-weight:600;color:var(--danger)}
.fine{margin:0;padding:6px 28px 24px;font-size:12.5px;color:var(--muted)}
.fine a{color:var(--accent-ink)}
@media (max-width:420px){.top,form{padding-left:20px;padding-right:20px}.fine{padding:6px 20px 20px}}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 36V17L22 6l16 11v19h-9"/></svg><span>Renovion<b>Groep</b></span></div>
    <span class="eb">Persoonlijke offerte</span>
    <h1 id="title">Uw offerte</h1>
  </div>
  <form id="f" autocomplete="off" novalidate>
    <p class="sub">Vul uw mobiele nummer en de toegangscode in die u van Renovion Groep heeft ontvangen.</p>
    <label for="tel">Mobiel nummer<input id="tel" name="tel" inputmode="tel" autocomplete="tel" placeholder="06 12 34 56 78"></label>
    <label for="code">Toegangscode<input id="code" name="code" inputmode="text" autocapitalize="characters" maxlength="10" placeholder="123456"></label>
    <p class="hint">Een deelcode van 8 tekens werkt zonder mobiel nummer.</p>
    <button type="submit" id="go">Offerte openen</button>
    <p class="msg" id="msg" role="alert" aria-live="polite"></p>
  </form>
  <p class="fine">De code is persoonlijk en tijdelijk geldig. Geen code of verlopen? Mail <a id="mail" href="mailto:info@renoviongroep.nl">info@renoviongroep.nl</a>.</p>
</main>
<script>
(function(){
  var C=window.RENOVION_LOGIN||{};
  var $=function(i){return document.getElementById(i)};
  if(C.project)$('title').textContent=C.project;
  if(C.email){$('mail').href='mailto:'+C.email;$('mail').textContent=C.email}
  var norm=function(c){return String(c||'').toUpperCase().replace(/[^0-9A-Z]/g,'')};
  var digits=function(t){return String(t||'').replace(/\D/g,'')};
  var fmt=function(v){if(!v)return'';var d=new Date(v.length===10?v+'T23:59':v);return isNaN(d)?v:d.toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'})};
  var url=C.url||location.pathname.replace(/\/$/,'')+'/toegang';
  setTimeout(function(){$('tel').focus()},50);
  $('f').addEventListener('submit',function(e){
    e.preventDefault();var m=$('msg'),code=norm($('code').value),tel=$('tel').value,only=code.length===8;
    m.textContent='';
    if(!only&&code.length!==6){m.textContent='Vul de toegangscode in: 6 cijfers, of een deelcode van 8 tekens.';$('code').focus();return}
    if(!only&&digits(tel).length<9){m.textContent='Vul uw mobiele nummer in.';$('tel').focus();return}
    var b=$('go');b.disabled=true;b.textContent='Controleren…';
    var h={'Content-Type':'application/json','Accept':'application/json'};if(C.csrf)h['X-CSRF-TOKEN']=C.csrf;
    fetch(url,{method:'POST',credentials:'same-origin',headers:h,body:JSON.stringify({tel:only?'':tel,code:code})})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(j){return{s:r.status,j:j}})})
      .then(function(x){
        if(x.s===200&&x.j.redirect){b.textContent='Offerte openen…';location.href=x.j.redirect;return}
        var e=x.j.error;
        m.textContent=x.s===429?'Te veel pogingen. Probeer het over een paar minuten opnieuw.':
          e==='verlopen'?'Deze code was geldig tot '+fmt(x.j.until)+'. Vraag Renovion Groep om een nieuwe code.':
          e==='nognniet'?'Uw toegang start op '+fmt(x.j.from)+'.':
          e==='dicht'?'Uw toegang staat op dit moment dicht. Neem contact op met Renovion Groep.':
          only?'Deze deelcode is niet bekend. Controleer hem en probeer het opnieuw.':'Dit mobiele nummer en deze code horen niet bij elkaar. Controleer ze en probeer het opnieuw.';
        b.disabled=false;b.textContent='Offerte openen';
      })
      .catch(function(){m.textContent='Er ging iets mis met de verbinding. Probeer het opnieuw.';b.disabled=false;b.textContent='Offerte openen'});
  });
})();
</script>
</body>
</html>
