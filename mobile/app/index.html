<!DOCTYPE html>
<html lang="nl" class="native-app" data-sec="vandaag" data-motion data-bundle>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Renovion OS</title>
    <!-- Weergave (licht/donker/telefoon) vóór het eerste beeld, uit de opslag; main.js werkt hem bij. -->
    <script>
        try {
            const theme = localStorage.getItem('renovion-os-theme') ?? 'licht';
            if (theme === 'donker' || (theme === 'telefoon' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('os-dark');
        } catch { /* geen opslag: licht */ }
    </script>
    <script type="module" src="./main.js"></script>
</head>
<body class="min-h-screen bg-gray-100 font-sans text-gray-900 antialiased" x-data>

    <!-- ===== Verplichte update (mobile/release.json, 426 van de server): bovenop alles, niet weg te tikken ===== -->
    <template x-if="$store.os.update">
        <div class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-navy-950 px-6 pt-safe pb-safe text-center text-white"
             @renovion-back.window="$event.preventDefault()">
            <span class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-500/15 text-brand-300">
                <span x-icon="'arrow-down-tray'" class="h-7 w-7"></span>
            </span>
            <h1 class="text-2xl font-bold">Update nodig</h1>
            <p class="mt-2 max-w-xs text-sm leading-relaxed text-navy-200">Er is een nieuwe versie van Renovion OS. Download de nieuwste versie om verder te werken.</p>
            <button type="button" x-show="$store.os.update?.url" @click="$store.os.openUpdate()"
                    class="mt-8 w-full max-w-xs rounded-xl bg-brand-500 py-3 text-sm font-bold text-white active:bg-brand-600">Nieuwste versie downloaden</button>
            <p x-show="!$store.os.update?.url" class="mt-8 w-full max-w-xs rounded-xl bg-navy-900 px-4 py-3 text-sm text-navy-200">Vraag kantoor om de nieuwste versie van de app.</p>
            <button type="button" @click="$store.os.checkVersion()" class="tap mt-3 text-sm font-semibold text-navy-300">Opnieuw controleren</button>
        </div>
    </template>

    <!-- ===== Inloggen ===== -->
    <template x-if="!$store.os.signedIn">
        <div x-data="login" class="flex min-h-screen items-center justify-center bg-navy-900 px-4 pt-safe pb-safe">
            <div class="w-full max-w-sm">
                <div class="mb-8 text-center">
                    <svg viewBox="70 88 470 156" role="img" aria-label="Renovion OS" class="mx-auto h-24 w-auto">
                        <path d="M117 205H80V136L140 99L200 136V152" fill="none" stroke="#F26A1B" stroke-width="7" />
                        <text x="124" y="205" textLength="288" lengthAdjust="spacingAndGlyphs" font-family="Outfit, sans-serif" font-size="70" font-weight="500" fill="#FFFFFF">Renovion</text>
                        <text x="428" y="205" textLength="96" lengthAdjust="spacingAndGlyphs" font-family="Outfit, sans-serif" font-size="70" font-weight="700" fill="#F26A1B">OS</text>
                        <text x="128" y="236" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" textLength="396" lengthAdjust="spacing" fill="#A9B5C8">ÉÉN PLATFORM. HELE BOUWPROJECTEN.</text>
                    </svg>
                </div>
                <form @submit.prevent="submit()" class="space-y-4 rounded-2xl bg-white p-6 shadow-xl">
                    <label class="block">
                        <span class="mb-1 block text-sm font-semibold text-gray-700">E-mailadres</span>
                        <input type="email" x-model="email" required autocomplete="username" class="w-full focus:border-brand-500 focus:ring-brand-500">
                    </label>
                    <label class="block">
                        <span class="mb-1 block text-sm font-semibold text-gray-700">Wachtwoord</span>
                        <input type="password" x-model="password" required autocomplete="current-password" class="w-full focus:border-brand-500 focus:ring-brand-500">
                    </label>
                    <p x-show="error" x-text="error" class="rounded-xl bg-red-100 px-3 py-2 text-sm font-medium text-red-800"></p>
                    <button type="submit" :disabled="busy" class="w-full rounded-xl bg-brand-500 py-3 text-sm font-bold text-white active:bg-brand-600 disabled:opacity-60">
                        <span x-text="busy ? 'Bezig met inloggen' : 'Inloggen'"></span>
                    </button>
                </form>
                <p class="mt-6 text-center text-xs"><a :href="$store.os.privacyUrl" class="tap text-navy-300">Privacyverklaring</a></p>
            </div>
        </div>
    </template>

    <!-- ===== App ===== -->
    <template x-if="$store.os.signedIn">
        <div>
            <!-- Topbalk -->
            <header x-data="{ plus: false }" @renovion-back.window="if (plus) { plus = false; $event.preventDefault(); }"
                    class="app-top phone-header sticky top-0 z-30 box-content flex h-[59px] items-center gap-2 bg-white px-3 pt-safe">
                <button type="button" @click="$store.os.drawer = true" class="app-iconbtn tap" aria-label="Menu openen"><span x-icon="'bars-3'" class="h-[18px] w-[18px]"></span></button>
                <template x-if="$store.os.crm">
                    <button type="button" @click="location.hash = '#/zoeken'" class="tap flex h-9 min-w-0 flex-1 items-center gap-2 rounded-full border border-gray-200 bg-white px-3 text-left text-sm text-gray-500">
                        <span x-icon="'magnifying-glass'" class="h-4 w-4"></span><span class="truncate">Zoeken</span>
                    </button>
                </template>
                <template x-if="!$store.os.crm">
                    <a href="#/vandaag" class="min-w-0 flex-1">
                        <svg viewBox="70 88 470 156" role="img" aria-label="Renovion OS" class="h-10 w-auto">
                            <path d="M117 205H80V136L140 99L200 136V152" fill="none" stroke="#F26A1B" stroke-width="7" />
                            <text x="124" y="205" textLength="288" lengthAdjust="spacingAndGlyphs" font-family="Outfit, sans-serif" font-size="70" font-weight="500" fill="#0D1A2E">Renovion</text>
                            <text x="428" y="205" textLength="96" lengthAdjust="spacingAndGlyphs" font-family="Outfit, sans-serif" font-size="70" font-weight="700" fill="#F26A1B">OS</text>
                        </svg>
                    </a>
                </template>
                <button type="button" @click="$store.os.help = true" class="app-iconbtn tap" aria-label="Hulp openen"><span x-icon="'question-mark-circle'" class="h-[18px] w-[18px]"></span></button>
                <button type="button" @click="location.hash = '#/meldingen'" class="app-iconbtn tap relative" aria-label="Meldingen">
                    <span x-icon="'bell'" class="h-[18px] w-[18px]"></span>
                    <span x-show="$store.os.counts.notifications > 0" x-cloak class="absolute top-1.5 right-1.5 h-2 w-2 rounded-full bg-brand-500 ring-2 ring-white"></span>
                </button>
                <div class="relative">
                    <button type="button" @click="plus = !plus" @click.outside="plus = false" aria-label="Nieuw"
                            class="tap flex h-[34px] w-[42px] items-center justify-center rounded-full bg-brand-500 text-white active:bg-brand-600">
                        <span x-icon="'plus'" class="h-[18px] w-[18px]"></span>
                    </button>
                    <div x-show="plus" x-cloak x-transition.origin.top.right class="app-menu">
                        <template x-for="item in $store.os.menu.plus" :key="item.label">
                            <button type="button" @click="plus = false; $store.os.open(item)">
                                <span x-icon="item.icon" class="h-4 w-4"></span> <span x-text="item.label"></span>
                            </button>
                        </template>
                        <template x-if="$store.os.crm">
                            <div>
                                <hr>
                                <button type="button" @click="plus = false; $store.os.nova = true"><span x-icon="'sparkles'" class="h-4 w-4"></span> Vraag Nova</button>
                            </div>
                        </template>
                    </div>
                </div>
            </header>

            <main>
                <div x-show="$store.os.offline" x-cloak class="-mx-4 -mt-4 mb-3 flex items-center gap-2 bg-amber-100 px-4 py-2 text-[13px] font-medium text-amber-800">
                    <span x-icon="'exclamation-triangle'" class="h-4 w-4"></span>
                    <span>Geen verbinding. Je ziet de gegevens van <span x-text="$store.os.shownAt ? osFormat.since($store.os.shownAt) : 'eerder'"></span>.</span>
                </div>

                <!-- ===== Vandaag ===== -->
                <template x-if="$store.os.route === 'vandaag'">
                    <div x-data="today">
                        <!-- Kop: staat er meteen, zonder gegevens -->
                        <section data-enter class="app-band mb-4">
                            <img :src="$store.os.heroUrl" alt="" class="bimg">
                            <div>
                                <p class="eyebrow" x-text="osFormat.today()"></p>
                                <h1 class="mt-1.5"><span class="!text-white" x-text="osFormat.greeting() + ','"></span> <span x-text="$store.os.profile.user.first_name"></span></h1>
                                <span class="rule"></span>
                                <p class="lede mt-3" x-show="$store.os.crm">Van aanvraag tot nazorg, alles in één systeem.</p>
                            </div>
                        </section>

                        <template x-if="failed">
                            <div class="app-card p-5 text-center">
                                <p class="text-sm font-semibold text-navy-900">Geen verbinding met de server</p>
                                <button type="button" @click="load()" class="app-btn mt-3">Opnieuw proberen</button>
                            </div>
                        </template>

                        <!-- Kantoor -->
                        <template x-if="$store.os.crm">
                            <div>
                                <div data-enter class="app-novaline mb-3">
                                    <img :src="$store.os.novaUrl" alt="Nova" class="h-9 w-9 rounded-full object-cover ring-2 ring-brand-500">
                                    <p>
                                        <template x-if="!data"><span class="block"><span class="skeleton mb-1.5 block h-3.5 w-4/5"></span><span class="skeleton block h-3.5 w-1/2"></span></span></template>
                                        <template x-if="data && data.attention_count > 0"><span>Je inbox heeft <b x-text="osFormat.tally(data.attention_count, 'punt', 'punten')"></b> die aandacht vragen.</span></template>
                                        <template x-if="data && data.attention_count === 0"><span>Alles loopt op schema. Geen openstaande acties voor vandaag.</span></template>
                                    </p>
                                    <a href="#/inbox" x-show="data && data.attention_count > 0" class="app-btn soft">Naar inbox <span x-icon="'chevron-right'" class="h-3.5 w-3.5"></span></a>
                                </div>

                                <section class="app-kpis mb-3">
                                    <a href="#/projecten" data-enter class="app-kpi dark">
                                        <span class="lbl">Werkvoorraad excl. btw</span>
                                        <span class="v"><i>€</i> <span x-text="data ? osFormat.euro(data.stats.omzet_lopend).slice(2) : ''"></span><span x-show="!data" class="skeleton skeleton-dark inline-block h-6 w-32 align-middle"></span></span>
                                        <span class="s" x-text="data ? osFormat.tally(data.stats.actieve_projecten, 'project', 'projecten') + ' in opdracht' : ' '"></span>
                                    </a>
                                    <a href="#/projecten" data-enter class="app-kpi" style="--kc: #3e6ba8">
                                        <span class="lbl">Lopende projecten</span>
                                        <span class="v"><span x-text="data?.stats.actieve_projecten"></span><span x-show="!data" class="skeleton inline-block h-6 w-10 align-middle"></span></span>
                                        <span class="s" x-text="data ? (data.stats.projecten_aandacht > 0 ? data.stats.projecten_aandacht + ' aandacht' : 'Op schema') : ' '"></span>
                                    </a>
                                    <button type="button" x-show="$store.os.profile.can.quotes" @click="$store.os.openWeb('/offertes')" data-enter class="app-kpi text-left" style="--kc: #1e8a5a">
                                        <span class="lbl">Open offertes</span>
                                        <span class="v"><span x-text="data?.stats.open_offertes"></span><span x-show="!data" class="skeleton inline-block h-6 w-10 align-middle"></span></span>
                                        <span class="s">Bij de klant</span>
                                    </button>
                                    <button type="button" @click="$store.os.openWeb('/aanvragen')" data-enter class="app-kpi wide text-left" style="--kc: #7c5cd6">
                                        <span class="lbl">Nieuwe aanvragen</span>
                                        <span class="v"><span x-text="data?.stats.nieuwe_aanvragen"></span><span x-show="!data" class="skeleton inline-block h-6 w-10 align-middle"></span></span>
                                        <span class="s" x-text="data ? data.stats.open_aanvragen + ' open in de pijplijn' : ' '"></span>
                                    </button>
                                </section>

                                <section data-enter class="app-card mb-3">
                                    <div class="app-card-h">
                                        <h3>Eerst <em>doen</em></h3>
                                        <a href="#/inbox" class="app-btn ghost">Naar de inbox</a>
                                    </div>
                                    <div class="app-card-b">
                                        <template x-if="!data">
                                            <div class="py-3"><template x-for="i in 3" :key="i"><div class="flex gap-3.5 py-3"><span class="skeleton h-9 w-9 shrink-0 !rounded-[11px]"></span><span class="flex-1"><span class="skeleton mb-2 block h-3.5 w-3/4"></span><span class="skeleton block h-3 w-1/2"></span></span></div></template></div>
                                        </template>
                                        <template x-for="item in data?.first ?? []" :key="item.title">
                                            <div class="app-li">
                                                <span class="app-ic" :class="item.tone"><span x-icon="item.icon" class="h-[18px] w-[18px]"></span></span>
                                                <span class="min-w-0 flex-1">
                                                    <b x-text="item.title"></b>
                                                    <small x-text="item.sub"></small>
                                                    <template x-if="item.action.tel"><a :href="'tel:' + item.action.tel" class="app-btn" x-text="item.action.label"></a></template>
                                                    <template x-if="item.action.path"><button type="button" @click="$store.os.go(item.action.path)" class="app-btn" x-text="item.action.label"></button></template>
                                                </span>
                                            </div>
                                        </template>
                                        <p x-show="data && data.first.length === 0" class="py-3 text-sm text-gray-500">Geen aanvragen of offertes die nu wachten.</p>
                                    </div>
                                </section>

                                <section data-enter class="app-card mb-3">
                                    <div class="app-card-h">
                                        <h3>Jouw <em>dag</em></h3>
                                        <a href="#/planning" class="app-btn ghost">Planning</a>
                                    </div>
                                    <div class="app-card-b">
                                        <template x-if="!data"><div class="py-3"><span class="skeleton mb-2 block h-3.5 w-1/4"></span><span class="skeleton block h-3.5 w-2/3"></span></div></template>
                                        <template x-for="entry in data?.planning ?? []" :key="entry.id">
                                            <div class="app-li">
                                                <span class="min-w-0 flex-1">
                                                    <span class="mb-1 block font-[family-name:var(--font-display)] font-semibold text-navy-900" x-text="entry.start ?? 'Hele dag'"></span>
                                                    <b x-text="entry.title"></b>
                                                    <small x-text="[entry.who, entry.type].filter(Boolean).join(', ')"></small>
                                                    <button type="button" @click="$store.os.go(entry.path)" class="app-btn">Dossier</button>
                                                </span>
                                            </div>
                                        </template>
                                        <p x-show="data && data.planning.length === 0" class="py-3 text-sm text-gray-500">Niets gepland voor vandaag.</p>
                                    </div>
                                </section>

                                <section data-enter class="app-card mb-3">
                                    <div class="app-card-h">
                                        <h3>Mijn <em>taken</em></h3>
                                        <a href="#/taken" class="app-btn ghost">Alle taken</a>
                                    </div>
                                    <div class="app-card-b">
                                        <template x-if="!data"><div class="py-3"><span class="skeleton mb-2 block h-3.5 w-2/3"></span><span class="skeleton block h-3 w-1/3"></span></div></template>
                                        <template x-for="task in data?.tasks ?? []" :key="task.id">
                                            <div class="app-li" :class="task.done && 'opacity-50'">
                                                <span class="app-ic" :class="task.overdue ? 'bad' : 'blue'"><span x-icon="'clipboard-check'" class="h-[18px] w-[18px]"></span></span>
                                                <span class="min-w-0 flex-1">
                                                    <b x-text="task.title"></b>
                                                    <small x-text="[task.deadline ? osFormat.day(task.deadline) : null, task.context].filter(Boolean).join(', ')"></small>
                                                    <button type="button" @click="finish(task)" :disabled="task.done" class="app-btn" aria-label="Taak afronden"><span x-icon="'check'" class="h-4 w-4"></span></button>
                                                </span>
                                            </div>
                                        </template>
                                        <p x-show="data && data.tasks.length === 0" class="py-3 text-sm text-gray-500">Geen open taken.</p>
                                    </div>
                                </section>

                                <section x-show="data?.projects.length">
                                    <div class="app-chat-head mt-5 mb-2">
                                        <h2 class="text-[17px] font-semibold text-navy-900">Recent in uitvoering</h2>
                                        <a href="#/projecten" class="app-btn ghost">Alle projecten</a>
                                    </div>
                                    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                                        <template x-for="project in data?.projects ?? []" :key="project.id">
                                            <div data-enter class="app-pcard cursor-pointer" @click="$store.os.go(project.path)">
                                                <span class="flex items-center justify-between gap-2">
                                                    <span class="id truncate" x-text="project.phase ?? project.status.label"></span>
                                                    <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold whitespace-nowrap" :class="project.status.classes" x-text="project.status.label"></span>
                                                </span>
                                                <h4 x-text="project.name"></h4>
                                                <span class="sub truncate" x-text="[project.customer, project.city].filter(Boolean).join(', ')"></span>
                                                <template x-if="project.value !== null">
                                                    <span class="flex items-center justify-between gap-2 text-sm">
                                                        <span class="text-gray-500">Projectwaarde</span>
                                                        <b class="font-[family-name:var(--font-display)] font-semibold text-navy-900" x-text="osFormat.euro(project.value)"></b>
                                                    </span>
                                                </template>
                                                <span class="block">
                                                    <span class="mb-1 flex items-center justify-between text-xs text-gray-500"><span>Voortgang</span><span class="font-semibold" x-text="project.progress + '%'"></span></span>
                                                    <span class="app-bar"><i :style="`width: ${project.progress}%`"></i></span>
                                                </span>
                                                <template x-if="project.leader">
                                                    <span class="flex items-center gap-2 text-[13px] text-gray-600">
                                                        <span class="flex h-6 w-6 items-center justify-center rounded-full bg-brand-500 text-[10px] font-bold text-white" x-text="osFormat.initials(project.leader)"></span>
                                                        <span x-text="project.leader"></span>
                                                    </span>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </section>
                            </div>
                        </template>

                        <!-- Uitvoerder -->
                        <template x-if="!$store.os.crm">
                            <div>
                                <section data-enter class="mb-6 rounded-2xl border border-gray-200 bg-white p-4">
                                    <template x-if="!data"><div><span class="skeleton mb-2 block h-6 w-2/3"></span><span class="skeleton mb-4 block h-4 w-1/2"></span><span class="skeleton block h-2.5 w-full"></span></div></template>
                                    <template x-if="data && !data.project"><p class="text-sm text-gray-500">Zodra je op een project wordt ingedeeld, staat het hier.</p></template>
                                    <template x-if="data?.project">
                                        <div>
                                            <button type="button" @click="$store.os.go(data.project.path)" class="block w-full text-left">
                                                <span class="block truncate text-xl font-bold text-navy-950" x-text="data.project.name"></span>
                                                <span class="block truncate text-sm text-gray-500" x-text="[data.project.customer, data.project.city].filter(Boolean).join(', ')"></span>
                                            </button>
                                            <div class="mt-4 flex items-center gap-3">
                                                <span class="app-bar flex-1"><i :style="`width: ${data.project.progress}%`"></i></span>
                                                <span class="text-sm font-bold text-navy-950" x-text="data.project.progress + '%'"></span>
                                            </div>
                                            <p class="mt-1.5 text-sm font-semibold text-navy-900" x-text="data.project.phase ?? data.project.status.label"></p>
                                            <div class="mt-4 grid grid-cols-3 gap-2 border-t border-gray-100 pt-4">
                                                <template x-for="tile in [['Chat', 'chat-bubble', '/chat', data.project.chat_unread ? data.project.chat_unread + ' nieuw' : 'Geen nieuwe'], ['Werk', 'clipboard-check', data.project.path, data.project.open_work ? data.project.open_work + ' open' : 'Alles af'], ['Foto\'s', 'photo', data.project.path + '?tab=fotos', data.project.photos + ' totaal']]" :key="tile[0]">
                                                    <button type="button" @click="$store.os.go(tile[2])" class="flex min-w-0 flex-col items-center gap-1 rounded-xl py-1 text-center active:bg-gray-50">
                                                        <span class="flex h-12 w-12 items-center justify-center rounded-2xl border border-gray-200 bg-white text-navy-900 shadow-sm"><span x-icon="tile[1]" class="h-6 w-6"></span></span>
                                                        <span class="w-full truncate text-xs font-semibold text-navy-900" x-text="tile[0]"></span>
                                                        <span class="w-full truncate text-[10px] font-medium text-gray-500" x-text="tile[3]"></span>
                                                    </button>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </section>

                                <section data-enter class="mb-6">
                                    <h2 class="mb-2 text-base font-bold text-navy-950">Vandaag</h2>
                                    <div class="divide-y divide-gray-100 rounded-2xl border border-gray-200 bg-white">
                                        <template x-if="!data"><div class="p-4"><span class="skeleton block h-4 w-2/3"></span></div></template>
                                        <template x-for="task in data?.today ?? []" :key="task.id">
                                            <button type="button" @click="finish(task)" :disabled="task.done" class="flex w-full items-center gap-3 p-3 text-left" :class="task.done && 'opacity-50'">
                                                <span class="h-6 w-6 shrink-0 rounded-full border-2" :class="task.done ? 'border-green-500 bg-green-500' : 'border-gray-300'"></span>
                                                <span class="min-w-0 flex-1">
                                                    <span class="block truncate text-sm font-semibold" :class="task.overdue ? 'text-red-700' : 'text-navy-900'" x-text="task.title"></span>
                                                    <span class="block truncate text-xs text-gray-500" x-text="task.context ?? 'Algemeen'"></span>
                                                </span>
                                            </button>
                                        </template>
                                        <p x-show="data && data.today.length === 0" class="p-4 text-sm text-gray-500">Niets meer voor vandaag. Lekker bezig.</p>
                                    </div>
                                </section>

                                <section data-enter class="mb-6">
                                    <h2 class="mb-2 text-base font-bold text-navy-950">Jouw week</h2>
                                    <div class="divide-y divide-gray-100 rounded-2xl border border-gray-200 bg-white">
                                        <template x-if="!data"><div class="p-4"><span class="skeleton block h-4 w-1/2"></span></div></template>
                                        <template x-for="entry in data?.week ?? []" :key="entry.id">
                                            <button type="button" @click="$store.os.go(entry.path)" class="flex w-full items-center gap-3 p-3 text-left">

                            </p>
                            <div class="app-ph-acts">
                                <button type="button" @click="$store.os.openWeb(data?.links.create ?? '/aanvragen/create')" class="rounded-lg bg-brand-500 px-4 py-2 text-sm font-bold text-white active:bg-brand-600">

                                </button>

                        <template x-if="failed">
                            <div class="app-card p-5 text-center">
                                <p class="text-sm font-semibold text-navy-900">Geen verbinding met de server</p>

                            </div>
                        </template>

                        </template>

                            <template x-for="i in (data || failed ? 0 : 3)" :key="i">
                                <div class="app-card p-4"><span class="skeleton mb-2 block h-4 w-2/3"></span><span class="skeleton mb-1.5 block h-3 w-1/2"></span><span class="skeleton block h-3 w-1/3"></span></div>
                            </template>
                            <template x-for="lead in data ? current.leads : []" :key="lead.id">

                                        <span class="flex items-start justify-between gap-2">
                                            <b class="text-[15px] font-bold text-navy-900" x-text="lead.name"></b>
                                            <span x-show="lead.qualification" class="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-semibold" :class="lead.qualification?.classes" x-text="lead.qualification?.label"></span>
                                        </span>
                                        <span class="block text-xs text-gray-500" x-text="lead.sub"></span>
                                        <b x-show="lead.value" class="mt-1 block text-sm text-navy-900" x-text="osFormat.euro(lead.value)"></b>
                                        <span x-show="lead.lost_reason" class="mt-1 block text-xs text-gray-500" x-text="lead.lost_reason"></span>

                                                </span>
                                            </template>
                                        </span>
                                        <span class="mt-2 block text-xs text-gray-500" x-text="lead.assignee ?? 'Niet toegewezen'"></span>
                                    </a>
                                    <a x-show="lead.phone && current.value !== 'inactief'" :href="'tel:' + lead.phone" class="app-btn pri mt-3 w-full justify-center"><span x-icon="'phone'" class="h-4 w-4"></span> Contact opnemen</a>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- ===== Aanvraag ===== -->
                <template x-if="$store.os.route === 'aanvraag'">
                    <div>
                        <template x-for="id in [$store.os.param]" :key="id">
                            <div x-data="lead(id)">
                                <nav class="app-crumbs mb-2 !text-gray-500">
                                    <a href="#/aanvragen" class="tap">Aanvragen</a>
                                    <span x-icon="'chevron-right'" class="h-3 w-3"></span>
                                    <span x-text="data?.name ?? ''"></span>
                                </nav>
                                <div data-enter class="app-ph">
                                    <p class="sec-eye"><span x-icon="'inbox'"></span> Aanvraag</p>
                                    <h1><span x-text="data?.name ?? ''"></span><span x-show="!data" class="skeleton inline-block h-7 w-2/3 align-middle"></span></h1>
                                    <p class="sub" x-text="data?.subtitle ?? ''"></p>
                                    <div class="app-ph-acts" x-show="data">
                                        <span class="rounded-full px-3 py-1 text-sm font-semibold" :class="data?.status.classes" x-text="data?.status.label"></span>
                                        <button type="button" @click="$store.os.openWeb(data.links.edit)" class="app-btn">Bewerken</button>
                                    </div>
                                </div>

                                <template x-if="failed">
                                    <div class="app-card p-5 text-center">
                                        <p class="text-sm font-semibold text-navy-900">Geen verbinding met de server</p>

                                    </div>
                                </template>

                                <div x-show="data?.signals.length" class="mb-3 space-y-1.5 rounded-2xl border border-amber-200 bg-amber-50 p-4">

                                        </p>
                                    </template>
                                </div>

                                <div class="mb-3 grid grid-cols-2 gap-2" x-show="data">

                                    <button type="button" x-show="data?.links.quote" @click="$store.os.openWeb(data.links.quote)" class="app-btn justify-center"><span x-icon="'document-text'" class="h-4 w-4"></span> Offerte maken</button>
                                    <button type="button" @click="$store.os.go(data.customer.path)" class="app-btn justify-center"><span x-icon="'folder'" class="h-4 w-4"></span> Klantdossier</button>
                                </div>

                                <!-- Contactmoment vastleggen -->
                                <section data-enter class="app-card mb-3 p-4" x-show="data">

                                            <template x-for="[value, label, icon] in contactTypes" :key="value">
                                                <button type="button" @click="contact.type = value" class="tap flex items-center justify-center gap-1.5 rounded-xl border px-3 py-2.5 text-sm font-semibold"

                                                    <span x-icon="icon" class="h-4 w-4"></span> <span x-text="label"></span>
                                                </button>
                                            </template>
                                        </div>
                                        <label class="block"><span class="mb-1 block text-sm font-semibold text-gray-700">Wat is er besproken?</span>
                                            <textarea x-model="contact.summary" rows="2" required maxlength="2000" placeholder="Bijv. gebeld: wil eerst de badkamer, budget rond 15k" class="w-full"></textarea>
                                        </label>
                                        <label class="block"><span class="mb-1 block text-sm font-semibold text-gray-700">Volgende actie</span>
                                            <input type="text" x-model="contact.next_action" maxlength="255" placeholder="Bijv. terugbellen na foto's" class="w-full">
                                        </label>
                                        <label class="block"><span class="mb-1 block text-sm font-semibold text-gray-700">Gepland op</span>
                                            <input type="datetime-local" x-model="contact.next_action_at" class="w-full">
                                        </label>
                                        <p class="text-xs text-gray-500">Zonder volgende actie meldt Nova deze aanvraag na 3 dagen stilte in de Inbox.</p>
                                        <button type="submit" :disabled="busy === 'contact'" class="w-full rounded-xl bg-brand-500 py-2.5 text-sm font-bold text-white active:bg-brand-600 disabled:opacity-60" x-text="busy === 'contact' ? 'Bezig' : 'Vastleggen'"></button>
                                    </form>
                                </section>

                                <!-- Status -->
                                <section data-enter class="app-card mb-3 p-4" x-show="data">
                                    <h2 class="mb-3 text-sm font-bold text-navy-900">Status</h2>
                                    <div class="flex flex-wrap gap-2">
                                        <template x-for="status in data?.statuses ?? []" :key="status.value">
                                            <button type="button" @click="setStatus(status)" :disabled="busy === 'status'"
                                                    class="tap min-h-9 rounded-full px-3.5 py-1.5 text-[13px] font-semibold"
                                                    :class="status.value === data.status.value ? status.classes + ' ring-2 ring-navy-900/15' : 'bg-gray-100 text-gray-600'"
                                                    :aria-pressed="status.value === data.status.value" x-text="status.label"></button>
                                        </template>
                                    </div>
                                </section>

                                <!-- Aanvraag -->
                                <section data-enter class="app-card mb-3 p-4" x-show="data">
                                    <h2 class="mb-2 text-sm font-bold text-navy-900">Aanvraag</h2>

                                        <div><span class="app-lbl">Dienst</span><b x-text="data?.details.service ?? '-'"></b></div>
                                        <div><span class="app-lbl">Waarde</span><b x-text="data?.details.value ? osFormat.euro(data.details.value) : '-'"></b></div>
                                        <div><span class="app-lbl">Kwalificatie</span><b><span class="inline-block rounded-full px-2.5 py-0.5 text-xs font-semibold" :class="data?.details.qualification.classes" x-text="data?.details.qualification.label"></span></b></div>
                                        <div><span class="app-lbl">Gewenste start</span><b x-text="data?.details.desired_start ?? '-'"></b></div>
                                        <div><span class="app-lbl">Bron</span><b x-text="data?.details.source"></b></div>
                                        <div><span class="app-lbl">Binnengekomen</span><b x-text="data ? osFormat.since(data.details.created_at) : ''"></b></div>
                                        <div><span class="app-lbl">Toegewezen aan</span><b x-text="data?.details.assignee ?? 'Niet toegewezen'"></b></div>
                                        <div><span class="app-lbl">Laatste contact</span><b x-text="data?.details.last_contact_at ? osFormat.since(data.details.last_contact_at) : 'Nog geen'"></b></div>
                                        <div class="col-span-2"><span class="app-lbl">Volgende actie</span><b x-text="(data?.details.next_action ?? '-') + (data?.details.next_action_at ? ' (' + osFormat.since(data.details.next_action_at) + ')' : '')"></b></div>
                                        <div class="col-span-2" x-show="data?.details.description"><span class="app-lbl">Omschrijving</span><b class="whitespace-pre-line" x-text="data?.details.description"></b></div>
                                    </div>
                                </section>

                                <!-- Contactgegevens -->
                                <section data-enter class="app-card mb-3 p-4" x-show="data">
                                    <h2 class="mb-2 text-sm font-bold text-navy-900">Contactgegevens</h2>
                                    <div class="app-fields !mt-0">
                                        <div><span class="app-lbl">Telefoon</span><b :class="!data?.customer.phone && 'text-amber-700'" x-text="data?.customer.phone ?? 'Ontbreekt'"></b></div>
                                        <div><span class="app-lbl">E-mail</span><b class="break-all" x-text="data?.customer.email ?? '-'"></b></div>
                                        <div class="col-span-2"><span class="app-lbl">Adres</span><b x-text="[data?.customer.address, data?.customer.postal_city].filter(Boolean).join(', ') || '-'"></b></div>
                                    </div>
                                </section>

                                <!-- Calculaties, offertes, taken -->
                                <template x-for="[label, key, empty, add] in [['Calculaties', 'calculations', 'Nog geen calculaties voor deze aanvraag.', 'calculation'], ['Offertes', 'quotes', 'Nog geen offertes.', 'quote'], ['Open taken', 'tasks', 'Geen open taken.', null]]" :key="key">
                                    <section data-enter class="app-card mb-3" x-show="data && data[key] !== null">
                                        <div class="app-card-h">
                                            <h3 x-text="label"></h3>
                                            <button type="button" x-show="add && data?.links[add]" @click="$store.os.openWeb(data.links[add])" class="tap text-xs font-semibold text-brand-700">+ Nieuw</button>
                                        </div>
                                        <div class="app-card-b">
                                            <p x-show="(data?.[key] ?? []).length === 0" class="py-3 text-sm text-gray-500" x-text="empty"></p>
                                            <template x-for="item in data?.[key] ?? []" :key="item.id">
                                                <button type="button" @click="item.path && $store.os.go(item.path)" class="app-li w-full text-left">
                                                    <span class="min-w-0 flex-1">
                                                        <b class="truncate" x-text="item.title ?? item.number"></b>
                                                        <small x-text="item.sub"></small>
                                                    </span>
                                                    <span x-show="item.status" class="mt-0.5 shrink-0 rounded-full px-2.5 py-0.5 text-xs font-semibold whitespace-nowrap" :class="item.status?.classes" x-text="item.status?.label"></span>
                                                </button>
                                            </template>
                                        </div>
                                    </section>
                                </template>

                                <!-- Laatste activiteit -->
                                <section data-enter class="app-card mb-3 p-4" x-show="data">
                                    <div class="mb-3 flex items-center justify-between">
                                        <h2 class="text-sm font-bold text-navy-900">Laatste activiteit</h2>
                                        <button type="button" @click="$store.os.go(data.customer.path)" class="tap text-xs font-semibold text-brand-700">Volledig dossier</button>
                                    </div>
                                    <p x-show="data && data.timeline.length === 0" class="text-sm text-gray-500">Nog geen activiteit.</p>
                                    <ol class="space-y-3">
                                        <template x-for="event in data?.timeline ?? []" :key="event.id">
                                            <li class="flex gap-2.5">
                                                <img x-show="event.nova" :src="$store.os.novaUrl" alt="Nova" class="h-6 w-6 shrink-0 rounded-full object-cover ring-1 ring-brand-300">
                                                <span x-show="!event.nova" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-gray-100 text-gray-500"><span x-icon="event.icon" class="h-3.5 w-3.5"></span></span>
                                                <span class="min-w-0 flex-1">
                                                    <span class="block text-sm font-medium text-navy-900" x-text="event.title"></span>
                                                    <span class="block text-xs text-gray-500" x-text="osFormat.since(event.at) + ', ' + (event.nova ? 'Nova' : event.who)"></span>
                                                </span>
                                            </li>
                                        </template>
                                    </ol>
                                </section>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- ===== Chat (kanalen) ===== -->
                <template x-if="$store.os.route === 'chat'">
                    <div x-data="chats" class="app-chat-list">
                        <div class="app-chat-head">
                            <h1>Chats</h1>
                            <button type="button" x-show="data?.can_create" @click="adding = !adding; adding && $nextTick(() => $refs.newName.focus())" class="app-iconbtn tap" aria-label="Nieuw kanaal">
                                <span x-icon="'plus'" class="h-[18px] w-[18px]"></span>
                            </button>
                        </div>

                        <form x-show="adding" x-cloak @submit.prevent="createChannel()" class="mb-3 space-y-3 rounded-xl bg-white p-3">
                            <label class="block">
                                <span class="mb-1 block text-xs font-semibold text-gray-600">Naam van het kanaal</span>
                                <input x-ref="newName" type="text" x-model="newName" required maxlength="60" placeholder="Bijv. Werkvoorbereiding" class="w-full">
                            </label>
                            <div class="flex gap-2">
                                <button type="submit" :disabled="saving" class="flex-1 rounded-xl bg-brand-500 py-2.5 text-sm font-bold text-white active:bg-brand-600 disabled:opacity-60" x-text="saving ? 'Bezig' : 'Toevoegen'"></button>
                                <button type="button" @click="adding = false" class="app-btn">Annuleren</button>
                            </div>
                        </form>

                        <label class="relative mb-2.5 block">
                            <span x-icon="'magnifying-glass'" class="pointer-events-none absolute top-1/2 left-3.5 h-4 w-4 -translate-y-1/2 text-gray-500"></span>
                            <input type="search" x-model="q" aria-label="Zoek gesprek" placeholder="Zoek gesprek" class="w-full !rounded-[12px] !border-transparent bg-white !pl-10" @keydown.enter="$el.blur()">
                        </label>

                        <div class="-mx-3 mb-2.5 flex gap-1.5 overflow-x-auto px-3 pb-1 [scrollbar-width:none]">
                            <template x-for="[value, label] in [['alles', 'Alles'], ['ongelezen', 'Ongelezen'], ['project', 'Projecten'], ['team', 'Teams']]" :key="value">
                                <button type="button" @click="filter = value" :class="filter === value ? 'bg-navy-950 text-white' : 'bg-white text-navy-900'" class="h-8 shrink-0 rounded-full px-3 text-[13px] font-semibold" :aria-pressed="filter === value" x-text="label"></button>
                            </template>
                        </div>

                        <template x-if="failed">
                            <div class="rounded-xl bg-white p-5 text-center">
                                <p class="text-sm font-semibold text-navy-900">Geen verbinding met de server</p>
                                <button type="button" @click="load()" class="app-btn mt-3">Opnieuw proberen</button>
                            </div>
                        </template>

                        <template x-for="i in (data || failed ? 0 : 6)" :key="i">
                            <div class="flex items-center gap-3 px-3 py-2.5"><span class="skeleton h-[42px] w-[42px] shrink-0 !rounded-full"></span><span class="min-w-0 flex-1"><span class="skeleton mb-1.5 block h-3.5 w-1/2"></span><span class="skeleton block h-3 w-2/3"></span></span></div>
                        </template>

                                <span class="app-chat-av flex shrink-0 items-center justify-center rounded-full">
                                    <span x-show="channel.kind === 'project'" x-icon="'folder'" class="h-5 w-5"></span>
                                    <span x-show="channel.kind === 'team'" class="text-lg leading-none font-semibold">#</span>
                                </span>
                                <span class="min-w-0 flex-1">
                                    <span class="flex items-baseline justify-between gap-3">
                                        <span class="truncate text-sm font-bold text-navy-950" x-text="channel.name"></span>
                                        <span x-show="channel.time" class="shrink-0 text-xs" :class="channel.unread ? 'font-semibold text-brand-700' : 'text-gray-500'" x-text="channel.time"></span>
                                    </span>
                                    <span class="mt-0.5 flex items-center justify-between gap-3">
                                        <span class="truncate text-[13px]" :class="channel.unread ? 'font-medium text-navy-900' : 'text-gray-600'" x-text="channel.preview ?? 'Nog geen berichten'"></span>
                                        <span x-show="channel.unread" class="flex h-5 min-w-5 shrink-0 items-center justify-center rounded-full bg-brand-500 px-1.5 text-[11px] font-bold text-white" x-text="channel.unread"></span>
                                    </span>
                                </span>
                            </a>
                        </template>
                        <p x-show="data && !data.channels.some((channel) => shows(channel))" x-cloak class="px-3 py-6 text-center text-sm text-gray-500">Geen gesprekken in deze weergave.</p>
                    </div>
                </template>

                    <div>
                        <template x-for="id in [$store.os.param]" :key="id">
                            <div x-data="conversation(id)" class="chat-panel fixed inset-x-0 top-0 z-[50] flex h-dvh flex-col bg-white">
                                <header class="flex shrink-0 items-center gap-3 border-b px-3 pb-2.5 pt-[calc(0.6rem_+_env(safe-area-inset-top))]">
                                    <button type="button" @click="back()" class="tap -ml-1 rounded-lg p-1.5 text-navy-900" aria-label="Terug naar de chats"><span x-icon="'chevron-left'" class="h-6 w-6"></span></button>
                                    <span class="app-chat-av flex h-9 w-9 shrink-0 items-center justify-center rounded-full !bg-gray-100">
                                        <span x-show="data?.kind === 'project'" x-icon="'folder'" class="h-[18px] w-[18px]"></span>
                                        <span x-show="data?.kind !== 'project'" class="text-base leading-none font-semibold">#</span>
                                    </span>
                                    <span class="min-w-0 flex-1">
                                        <span class="block truncate text-[15px] font-bold text-navy-950" x-text="data?.name ?? ''"></span>
                                        <span class="block truncate text-xs text-gray-500" x-text="data?.subtitle ?? ''"></span>
                                        <span x-show="!data" class="skeleton block h-4 w-1/2"></span>
                                    </span>
                                    <button type="button" x-show="data?.project_path" @click="$store.os.go(data.project_path)" class="app-btn shrink-0 !px-3 text-xs">Project</button>
                                </header>

                                    <span x-icon="'exclamation-triangle'" class="h-4 w-4"></span><span>Geen verbinding. Nieuwe berichten komen als hij terug is.</span>
                                </div>

                                <div x-ref="scroll" class="chat-scroll min-h-0 flex-1 overflow-y-auto px-3 py-3" @click.self="actionsFor = null">
                                    <template x-if="failed">
                                        <div class="mx-auto mt-10 max-w-xs rounded-xl bg-white p-5 text-center">
                                            <p class="text-sm font-semibold text-navy-900">Geen verbinding met de server</p>
                                            <button type="button" @click="open()" class="app-btn mt-3">Opnieuw proberen</button>

                        <span class="skeleton ml-auto block h-10 w-2/5 !rounded-2xl"></span>
                    </div>
                    <div class="p-3 pb-[calc(0.75rem_+_env(safe-area-inset-bottom))]"><span class="skeleton block h-12 w-full !rounded-full"></span></div>
                </div>
            </template>
            <div x-show="$store.os.leaving && $store.os.leaving.kind !== 'gesprek'" x-cloak class="fixed inset-x-0 top-[calc(59px_+_env(safe-area-inset-top))] bottom-0 z-[35] overflow-hidden bg-gray-100 px-4 pt-4">
                <template x-if="$store.os.leaving?.tabs">
                    <div class="mb-4 flex gap-5"><span class="skeleton h-4 w-20"></span><span class="skeleton h-4 w-16"></span><span class="skeleton h-4 w-16"></span></div>
                </template>
                <template x-if="$store.os.leaving?.kind === 'chats'">
                    <div>
                        <div class="mb-3 flex items-center justify-between"><span class="skeleton h-7 w-24"></span><span class="skeleton h-9 w-9 !rounded-full"></span></div>
                        <span class="skeleton mb-3 block h-10 w-full !rounded-xl"></span>
                        <div class="mb-3 flex gap-2"><span class="skeleton h-7 w-14 !rounded-full"></span><span class="skeleton h-7 w-20 !rounded-full"></span><span class="skeleton h-7 w-20 !rounded-full"></span><span class="skeleton h-7 w-16 !rounded-full"></span></div>
                        <template x-for="i in 6" :key="i"><div class="flex items-center gap-3 py-2.5"><span class="skeleton h-9 w-9 shrink-0 !rounded-[11px]"></span><span class="min-w-0 flex-1"><span class="skeleton mb-1.5 block h-3.5 w-1/2"></span><span class="skeleton block h-3 w-1/3"></span></span></div></template>
                    </div>
                </template>
                <template x-if="$store.os.leaving?.kind === 'dossier'">
                    <div>
                        <div class="mb-3 rounded-[18px] bg-navy-950 p-4">
                            <span class="skeleton skeleton-dark mb-3 block h-3 w-1/2"></span>
                            <div class="mb-4 flex gap-2"><span class="skeleton skeleton-dark h-8 w-20 !rounded-full"></span><span class="skeleton skeleton-dark h-8 w-28 !rounded-full"></span></div>
                            <span class="skeleton skeleton-dark mb-2 block h-3 w-28"></span>
                            <span class="skeleton skeleton-dark mb-2 block h-7 w-3/4"></span>
                            <span class="skeleton skeleton-dark mb-5 block h-4 w-1/2"></span>
                            <div class="grid grid-cols-2 gap-x-4 gap-y-4"><template x-for="i in 4" :key="i"><span><span class="skeleton skeleton-dark mb-1.5 block h-2.5 w-2/3"></span><span class="skeleton skeleton-dark block h-4 w-3/4"></span></span></template></div>
                        </div>
                        <div class="rounded-[14px] border border-gray-200 bg-white p-4"><span class="skeleton mb-3 block h-4 w-1/3"></span><span class="skeleton mb-4 block h-2 w-full"></span><span class="skeleton block h-4 w-1/2"></span></div>
                    </div>
                </template>
                <template x-if="['lijst', 'form', 'kanban', 'zoeken'].includes($store.os.leaving?.kind)">
                    <div>
                        <span class="skeleton mb-2 block h-3 w-28"></span>
                        <span class="skeleton mb-3 block h-7 w-2/3"></span>
                        <span class="skeleton mb-5 block h-3.5 w-4/5"></span>
                        <template x-if="$store.os.leaving.kind === 'form'">
                            <div>
                                <div class="mb-3 space-y-4 rounded-[14px] border border-gray-200 bg-white p-4"><template x-for="i in 4" :key="i"><div><span class="skeleton mb-2 block h-3 w-24"></span><span class="skeleton block h-11 w-full !rounded-xl"></span></div></template></div>
                                <span class="skeleton block h-11 w-full !rounded-full"></span>
                            </div>
                        </template>
                        <template x-if="$store.os.leaving.kind === 'kanban'">
                            <div>
                                <div class="mb-3 flex gap-2"><span class="skeleton h-7 w-16 !rounded-full"></span><span class="skeleton h-7 w-12 !rounded-full"></span></div>
                                <span class="skeleton mb-3 block h-10 w-full !rounded-full"></span>
                                <div class="mb-3 grid grid-cols-2 gap-3"><span class="skeleton block h-20 !rounded-[14px]"></span><span class="skeleton block h-20 !rounded-[14px]"></span></div>
                                <div class="rounded-[14px] border border-gray-200 bg-white p-3"><span class="skeleton mb-3 block h-4 w-1/3"></span><template x-for="i in 2" :key="i"><div class="mb-2 rounded-xl border border-gray-200 p-3"><span class="skeleton mb-2 block h-4 w-1/2"></span><span class="skeleton mb-2 block h-3 w-1/3"></span><span class="skeleton block h-3 w-2/5"></span></div></template></div>
                            </div>
                        </template>
                        <template x-if="$store.os.leaving.kind === 'zoeken'">
                            <div><span class="skeleton mb-3 block h-11 w-full !rounded-xl"></span><span class="skeleton block h-32 w-full !rounded-[14px]"></span></div>
                        </template>
                        <template x-if="$store.os.leaving.kind === 'lijst'">
                            <div><template x-for="i in 4" :key="i"><div class="mb-3 rounded-[14px] border border-gray-200 bg-white p-4"><span class="skeleton mb-2 block h-4 w-2/3"></span><span class="skeleton mb-2 block h-3 w-1/2"></span><span class="skeleton block h-3 w-1/3"></span></div></template></div>
                        </template>
                    </div>
                </template>
            </div>
            <div x-show="$store.os.toastText" x-cloak x-transition.opacity class="fixed inset-x-4 bottom-[calc(84px_+_env(safe-area-inset-bottom))] z-[70] rounded-xl bg-navy-950 px-4 py-3 text-center text-sm font-medium text-white" x-text="$store.os.toastText"></div>
        </div>
    </template>
</body>
</html>
