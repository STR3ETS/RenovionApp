<!-- ===== Portfolio: lopende projecten met stoplichten ===== -->
<template x-if="$store.os.route === 'portfolio'">
    <div x-data="portfolio">
        <div data-enter class="app-ph">
            <p class="sec-eye"><span x-icon="'chart-bar'"></span> Overzicht</p>
            <h1><em>Portfolio</em></h1>
            <p class="sub">
                <span x-show="data" x-text="data ? osFormat.tally(data.projects.length, 'lopend project', 'lopende projecten') + ' met stoplichten' : ''"></span>
                <span x-show="!data" class="skeleton block h-3.5 w-1/2"></span>
            </p>
            <div class="app-ph-acts">
                <a href="#/projecten" class="app-btn min-h-11"><span x-icon="'folder'" class="h-4 w-4"></span> Projectenlijst</a>
            </div>
        </div>

        <!-- Tellers per licht, meteen het filter -->
        <div class="mb-3 grid grid-cols-2 gap-2">
            <template x-for="i in (data ? 0 : 4)" :key="i">
                <span class="skeleton h-[60px] !rounded-2xl"></span>
            </template>
            <template x-for="count in data?.counts ?? []" :key="count.value">
                <button type="button" @click="pickLight(count.value)" :aria-pressed="light === count.value"
                        class="flex min-h-11 items-center gap-3 rounded-2xl border p-3 text-left" :class="[card(count.dot), light === count.value && 'ring-2 ring-navy-900 ring-offset-1']">
                    <span class="h-3 w-3 shrink-0 rounded-full" :class="dot(count.dot)"></span>
                    <span class="min-w-0">
                        <span class="block text-xl leading-tight font-bold text-navy-900" x-text="count.count"></span>
                        <span class="block truncate text-xs font-medium text-gray-700" x-text="count.label"></span>
                    </span>
                </button>
            </template>
        </div>

        <!-- Sorteren -->
        <div class="app-chips -mx-4 !flex-nowrap items-center overflow-x-auto px-4 pb-1 [scrollbar-width:none]" x-show="data">
            <span class="shrink-0 text-xs font-semibold text-gray-500">Sorteer op</span>
            <template x-for="option in data?.sorts ?? []" :key="option.value">
                <button type="button" @click="pickSort(option.value)" class="app-chip shrink-0" :class="sort === option.value && 'on'" :aria-pressed="sort === option.value" x-text="option.label"></button>
            </template>
        </div>

        <template x-if="failed">
            <div class="app-card mb-3 p-5 text-center" :class="$data.failGone && 'os-gone'">
                <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                <button type="button" x-show="!$data.failGone" @click="load()" class="app-btn mt-3 min-h-11">Opnieuw proberen</button>
            </div>
        </template>

        <template x-if="data && data.projects.length === 0">
            <div class="app-card p-6 text-center">
                <span class="mx-auto mb-2 flex h-10 w-10 items-center justify-center rounded-full bg-gray-100 text-gray-500"><span x-icon="'building-office'" class="h-5 w-5"></span></span>
                <p class="text-sm font-semibold text-navy-900">Geen projecten in deze weergave</p>
                <p class="mt-0.5 text-xs text-gray-500">Pas het filter aan of start een project; stoplichten verschijnen zodra een project in uitvoering is.</p>
            </div>
        </template>

        <div class="space-y-2" x-show="!failed">
            <template x-for="i in (data ? 0 : 3)" :key="i">
                <div class="app-card p-4"><span class="skeleton mb-2 block h-4 w-2/3"></span><span class="skeleton mb-4 block h-3 w-1/2"></span><span class="skeleton mb-2 block h-2.5 w-full"></span><span class="skeleton block h-3 w-3/4"></span></div>
            </template>
            <template x-for="project in data?.projects ?? []" :key="project.id">
                <button type="button" data-enter @click="$store.os.go(project.path)" class="block w-full rounded-[14px] border border-l-4 border-gray-200 bg-white p-4 text-left shadow-sm" :class="border(project.overall.dot)">
                    <span class="flex items-start justify-between gap-3">
                        <span class="min-w-0 flex-1">
                            <span class="flex items-center gap-2">
                                <span class="h-2.5 w-2.5 shrink-0 rounded-full" :class="dot(project.overall.dot)"></span>
                                <b class="truncate text-sm font-bold text-navy-900" x-text="project.name"></b>
                            </span>
                            <span class="mt-0.5 block truncate text-xs text-gray-500" x-text="project.sub"></span>
                        </span>
                        <span class="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-bold" :class="project.overall.classes" x-text="project.overall.label"></span>
                    </span>

                    <!-- De vier lichten met de reden -->
                    <!-- Twee per rij: met vier naast elkaar werd "Planning" "Plann..." op de telefoon. -->
                    <span class="mt-3 grid grid-cols-2 gap-1.5">
                        <template x-for="signal in project.signals" :key="signal.key">
                            <span class="flex min-w-0 items-center gap-1.5 rounded-lg bg-gray-50 px-2 py-1.5" :title="signal.label + ': ' + signal.reason">
                                <span class="h-2 w-2 shrink-0 rounded-full" :class="dot(signal.dot)"></span>
                                <span class="truncate text-[11px] font-semibold text-gray-700" x-text="signal.label"></span>
                            </span>
                        </template>
                    </span>

                    <!-- Voortgang tegen plan: de balk is de werkelijke voortgang, het streepje het plan -->
                    <span class="mt-3 block">
                        <span class="flex items-end justify-between gap-2">
                            <span class="text-xs font-semibold text-gray-600">Voortgang tegen plan</span>
                            <span class="text-xs font-bold text-navy-900" x-text="project.progress + '%'"></span>
                        </span>
                        <span class="relative mt-1.5 block h-2.5 overflow-hidden rounded-full bg-gray-200">
                            <span class="block h-full rounded-full" :class="bar(project.bar === 'brand' ? null : project.bar)" :style="`width: ${project.progress}%`"></span>
                            <span x-show="project.expected !== null" class="absolute top-0 h-full w-0.5 bg-navy-950/60" :style="`left: ${project.expected}%`"></span>
                        </span>
                        <span class="mt-1 block text-xs text-gray-500" x-text="project.plan"></span>
                    </span>

                    <span class="mt-3 grid grid-cols-2 gap-3 text-xs">
                        <span class="min-w-0">
                            <span class="block font-semibold text-gray-600">Volgende mijlpaal</span>
                            <span class="mt-0.5 block font-bold text-navy-900" x-text="project.milestone"></span>
                            <span class="block text-gray-500" x-text="project.milestone_due"></span>
                        </span>
                        <span class="min-w-0">
                            <span class="block font-semibold text-gray-600">Grootste blokkade</span>
                            <span class="mt-0.5 block leading-relaxed font-medium" :class="project.blocker ? { red: 'text-red-700', amber: 'text-amber-800', green: 'text-green-700' }[project.overall.dot] ?? 'text-gray-700' : 'text-gray-500'" x-text="project.blocker ?? 'Geen, alles loopt.'"></span>
                        </span>
                    </span>
                </button>
            </template>
        </div>
    </div>
</template>
