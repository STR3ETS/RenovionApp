<!-- ===== Offertedocument (zoals de klant het ziet, met PDF): screens/offertedocument.js ===== -->
<template x-if="$store.os.route === 'offertedocument'">
    <div>
        <template x-for="id in [$store.os.param]" :key="id">
            <div x-data="quoteDocument(id)">
                <nav class="app-crumbs mb-2 !text-gray-500">
                    <template x-if="data?.project">
                        <span class="contents">
                            <button type="button" @click="$store.os.go(data.project.path)" class="tap inline-flex min-w-0 items-center gap-1 font-semibold !text-brand-700"><span x-icon="'folder'" class="h-3.5 w-3.5 shrink-0"></span><span class="truncate" x-text="data.project.name"></span></button>
                            <span x-icon="'chevron-right'" class="h-3 w-3 shrink-0"></span>
                        </span>
                    </template>
                    <a :href="'#/offerte/' + id" class="tap inline-flex min-w-0 items-center gap-1"><span x-icon="'document-text'" class="h-3.5 w-3.5 shrink-0"></span><span class="truncate" x-text="data ? 'Offerte ' + data.number : 'Offerte'"></span></a>
                    <span x-icon="'chevron-right'" class="h-3 w-3 shrink-0"></span>
                    <span>Document</span>
                </nav>

                <div data-enter class="app-ph">
                    <p class="sec-eye"><span x-icon="'document-text'"></span> Offerte</p>
                    <h1><span x-text="data?.title ?? ''"></span><span x-show="!data" class="skeleton inline-block h-7 w-2/3 align-middle"></span></h1>
                    <p class="sub" x-text="data ? data.number + ', v' + data.version + ' · ' + data.customer : ''"></p>
                    <div class="app-ph-acts" x-show="data">
                        <button type="button" @click="pdf()" :disabled="printing" class="rounded-lg bg-brand-500 px-4 py-2 text-sm font-bold text-white active:bg-brand-600 disabled:opacity-60">
                            <span class="inline-flex items-center gap-1.5"><span x-icon="'arrow-down-tray'" class="h-4 w-4"></span> PDF</span>
                        </button>
                    </div>
                </div>

                <template x-if="failed">
                    <div class="app-card p-5 text-center">
                        <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                        <button type="button" @click="load()" x-show="!$data.failGone" class="app-btn mt-3">Opnieuw proberen</button>
                    </div>
                </template>

                <p x-show="data?.concept" class="mb-3 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm font-medium text-amber-900">
                    Concept: de klant ziet dit pas na het versturen.
                </p>

                <template x-if="!data && !failed">
                    <div class="space-y-3">
                        <div class="skeleton h-48 rounded-2xl"></div>
                        <div class="skeleton h-32 rounded-2xl"></div>
                    </div>
                </template>

                <!-- Het vel: wat de klant ziet, altijd licht (shadow root, zie offertedocument.js). -->
                <div x-show="data" class="pb-6">
                    <p class="os-paper-label">
                        <span x-icon="'eye'" class="h-4 w-4"></span>
                        <span x-text="'Zo ziet ' + (data?.customer ?? 'de klant') + ' de offerte'"></span>
                    </p>
                    <div x-ref="paper" x-effect="data && $nextTick(() => paint())" class="os-paper"></div>
                </div>
            </div>
        </template>
    </div>
</template>
