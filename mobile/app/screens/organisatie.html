<!-- ===== Organisatie: bedrijfsgegevens en standaardwaarden (alleen directie) ===== -->
<template x-if="$store.os.route === 'organisatie'">
    <div x-data="companySettings">
        <nav class="app-sectabs" aria-label="Onderdelen van Organisatie">
            <a href="#/organisatie" class="on" aria-current="page">Bedrijf</a>
            <a href="#/instellingen">Meldingen en weergave</a>
        </nav>

        <div data-enter class="app-ph">
            <p class="sec-eye"><span x-icon="'cog'"></span> Organisatie</p>
            <h1><em>Instellingen</em></h1>
            <p class="sub">Bedrijfsgegevens en de standaardwaarden waarmee het systeem rekent.</p>
        </div>

        <template x-if="failed">
            <div class="app-card mb-3 p-5 text-center" :class="$data.failGone && 'os-gone'">
                <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                <button type="button" x-show="!$data.failGone" @click="load()" class="app-btn mt-3 min-h-11">Opnieuw proberen</button>
            </div>
        </template>

        <form @submit.prevent="save()" x-show="!failed">
            <template x-for="i in (data ? 0 : 2)" :key="i">
                <div class="app-card mb-4 p-4">
                    <span class="skeleton mb-4 block h-4 w-1/3"></span>
                    <template x-for="j in 3" :key="j"><div class="mb-3"><span class="skeleton mb-1.5 block h-3 w-1/4"></span><span class="skeleton block h-11 w-full"></span></div></template>
                </div>
            </template>

            <template x-for="group in data?.groups ?? []" :key="group.name">
                <section data-enter class="app-card mb-4 p-4">
                    <h2 class="mb-3 text-sm font-bold text-navy-900" x-text="group.name"></h2>
                    <div class="space-y-3">
                        <template x-for="field in group.fields" :key="field.key">
                            <label class="block min-w-0">
                                <span class="mb-1 block text-xs font-semibold text-gray-600" x-text="field.label"></span>
                                <input type="text" :inputmode="field.type === 'number' ? 'decimal' : (field.key === 'bedrijf.email' ? 'email' : (field.key === 'bedrijf.telefoon' ? 'tel' : 'text'))"
                                       :value="value(field)" @input="set(field, $event.target.value)" maxlength="500" class="min-h-11 w-full min-w-0">
                                <span x-show="field.hint" class="mt-1 block text-xs text-gray-500" x-text="field.hint"></span>
                            </label>
                        </template>
                    </div>
                </section>
            </template>

            <!-- Opslaan: met wijzigingen blijft de knop in beeld boven de onderbalk (rechts ruimte voor Nova) -->
            <div x-show="data" class="z-10 mb-4" :class="dirty && 'sticky bottom-[calc(76px_+_env(safe-area-inset-bottom))] pr-[72px]'">
                <button type="submit" :disabled="saving || !dirty"
                        class="flex min-h-11 w-full items-center justify-center rounded-full text-sm font-bold"
                        :class="dirty ? 'bg-brand-500 text-white shadow-lg active:bg-brand-600' : 'border border-gray-200 bg-white text-gray-500'"
                        x-text="saving ? 'Bezig met opslaan' : (dirty ? 'Instellingen opslaan' : 'Alles is opgeslagen')"></button>
            </div>
        </form>

        <!-- Omgeving: alleen of het er is, nooit de waarde -->
        <section data-enter class="app-card mb-4 p-4" x-show="data">
            <h2 class="text-sm font-bold text-navy-900">Omgeving</h2>
            <p class="mb-3 text-xs text-gray-500">Sleutels en tokens staan in .env, niet in de database. Hier zie je alleen of ze er zijn.</p>
            <div class="space-y-3">
                <template x-for="item in data?.environment ?? []" :key="item.label">
                    <div class="flex items-start gap-3">
                        <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full" :class="item.ready ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'"><span x-icon="item.ready ? 'check' : 'x-mark'" class="h-3.5 w-3.5"></span></span>
                        <span class="min-w-0 flex-1">
                            <b class="block text-sm font-semibold text-navy-900" x-text="item.label"></b>
                            <small class="block text-xs" :class="item.ready ? 'text-gray-500' : 'text-amber-800'" x-text="item.ready ? 'Ingesteld' : item.about"></small>
                        </span>
                    </div>
                </template>
            </div>
        </section>

        <section data-enter class="app-card mb-4 p-4" x-show="data">
            <h2 class="text-sm font-bold text-navy-900">Modules</h2>
            <p class="mb-3 text-xs text-gray-500">Aan of uit via .env, daarna de caches verversen.</p>
            <div class="space-y-2">
                <template x-for="module in data?.modules ?? []" :key="module.name">
                    <div class="flex items-center justify-between gap-3 text-sm">
                        <span class="text-gray-800" x-text="module.name"></span>
                        <span class="rounded-full px-2.5 py-1 text-[11px] font-bold" :class="module.enabled ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'" x-text="module.enabled ? 'Aan' : 'Uit'"></span>
                    </div>
                </template>
            </div>
        </section>

        <section data-enter class="app-card mb-4" x-show="data?.links.length">
            <div class="app-card-b">
                <p class="pt-3 text-sm font-bold text-navy-900">Hulp</p>
                <template x-for="link in data?.links ?? []" :key="link.path">
                    <button type="button" @click="$store.os.go(link.path)" class="app-li w-full items-center text-left">
                        <span class="app-ic blue"><span x-icon="link.icon" class="h-[18px] w-[18px]"></span></span>
                        <b class="min-w-0 flex-1" x-text="link.label"></b>
                        <span x-icon="'chevron-right'" class="h-4 w-4 shrink-0 text-gray-400"></span>
                    </button>
                </template>
            </div>
        </section>
    </div>
</template>
