<!-- ===== Klantportaal: met de klant meekijken ===== -->
<template x-if="$store.os.route === 'klantportaal'">
    <div x-data="portalPreview">
        <div data-enter class="app-ph">
            <p class="sec-eye"><span x-icon="'home'"></span> Projecten</p>
            <h1><em>Klantportaal</em></h1>
            <p class="sub">Wat de klant ziet, van binnenuit te openen. Handig voordat je iets vrijgeeft.</p>
        </div>

        <template x-if="failed">
            <div class="app-card mb-3 p-5 text-center" :class="$data.failGone && 'os-gone'">
                <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                <button type="button" x-show="!$data.failGone" @click="load()" class="app-btn mt-3 min-h-11">Opnieuw proberen</button>
            </div>
        </template>

        <template x-if="data && data.projects.length === 0">
            <div class="app-card p-6 text-center">
                <span class="mx-auto mb-2 flex h-10 w-10 items-center justify-center rounded-full bg-gray-100 text-gray-500"><span x-icon="'home'" class="h-5 w-5"></span></span>
                <p class="text-sm font-semibold text-navy-900">Geen lopende projecten</p>
                <p class="mt-0.5 text-xs text-gray-500">Zodra er een project loopt, kun je hier meekijken met de klant.</p>
            </div>
        </template>

        <div data-enter class="app-card" x-show="!failed && (!data || data.projects.length > 0)">
            <div class="app-card-b">
                <template x-for="i in (data ? 0 : 5)" :key="i">
                    <div class="flex gap-3.5 py-3.5"><span class="skeleton h-9 w-9 shrink-0 !rounded-[11px]"></span><span class="flex-1"><span class="skeleton mb-2 block h-3.5 w-2/3"></span><span class="skeleton block h-3 w-full"></span></span></div>
                </template>
                <template x-for="project in data?.projects ?? []" :key="project.id">
                    <button type="button" @click="$store.os.go(project.path)" class="app-li w-full text-left">
                        <span class="app-ic" :class="project.waiting ? 'or' : 'ok'"><span x-icon="'home'" class="h-[18px] w-[18px]"></span></span>
                        <span class="min-w-0 flex-1">
                            <b x-text="project.name"></b>
                            <span class="mt-1 flex flex-wrap gap-1.5" x-show="!project.has_account || project.waiting">
                                <span x-show="!project.has_account" class="rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-bold text-amber-800">Geen portaalaccount</span>
                                <span x-show="project.waiting" class="rounded-full bg-brand-100 px-2 py-0.5 text-[11px] font-bold text-brand-800">Wacht op de klant</span>
                            </span>
                            <small x-text="project.sub"></small>
                        </span>
                        <span x-icon="'chevron-right'" class="mt-2.5 h-4 w-4 shrink-0 text-gray-400"></span>
                    </button>
                </template>
            </div>
        </div>
    </div>
</template>

<!-- ===== Een project zoals de klant het ziet ===== -->
<template x-if="$store.os.route === 'portaalproject'">
    <div>
        <template x-for="id in [$store.os.param]" :key="id">
            <div x-data="portalPreviewProject(id)">
                <nav class="app-crumbs mb-2 !text-gray-500">
                    <template x-if="data?.project">
                        <span class="contents">
                            <button type="button" @click="$store.os.go(data.project.path)" class="tap inline-flex min-w-0 items-center gap-1 font-semibold !text-brand-700"><span x-icon="'folder'" class="h-3.5 w-3.5 shrink-0"></span><span class="truncate" x-text="data.project.name"></span></button>
                            <span x-icon="'chevron-right'" class="h-3 w-3 shrink-0"></span>
                        </span>
                    </template>
                    <a x-show="!data?.project" href="#/klantportaal" class="tap">Klantportaal</a>
                    <span x-show="!data?.project" x-icon="'chevron-right'" class="h-3 w-3"></span>
                    <span>Klantportaal</span>
                </nav>

                <div data-enter class="app-ph">
                    <p class="sec-eye"><span x-icon="'eye'"></span> Zo ziet de klant het</p>
                    <h1><span x-text="data?.name ?? ''"></span><span x-show="!data" class="skeleton inline-block h-7 w-2/3 align-middle"></span></h1>
                    <p class="sub" x-text="data?.customer ?? ''"></p>
                    <div class="app-ph-acts" x-show="data">
                        <button type="button" @click="$store.os.go(data.links.dossier)" class="app-btn min-h-11"><span x-icon="'folder'" class="h-4 w-4"></span> Naar het dossier</button>
                    </div>
                </div>

                <template x-if="failed">
                    <div class="app-card mb-3 p-5 text-center" :class="$data.failGone && 'os-gone'">
                        <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                        <button type="button" x-show="!$data.failGone" @click="load()" class="app-btn mt-3 min-h-11">Opnieuw proberen</button>
                    </div>
                </template>

                <div x-show="data && !data.has_account" class="mb-3 flex items-start gap-3 rounded-2xl border border-amber-200 bg-amber-50 p-4">
                    <span x-icon="'key'" class="h-5 w-5 shrink-0 text-amber-700"></span>
                    <p class="text-sm text-gray-800"><b class="text-navy-900">Deze klant heeft nog geen portaalaccount.</b> Dit is wat hij zou zien. Een account maak je aan op de klantpagina.</p>
                </div>

                <!-- Voortgang zoals de klant die ziet -->
                <section data-enter class="app-card mb-3 p-4" x-show="!failed">
                    <h2 class="mb-3 text-sm font-bold text-navy-900">Voortgang <span class="text-brand-600">zoals de klant die ziet</span></h2>
                    <div class="mb-3 flex items-center gap-3">
                        <span class="h-3 flex-1 overflow-hidden rounded-full bg-gray-200"><span class="block h-full rounded-full bg-klant-500" :style="`width: ${data?.progress ?? 0}%`"></span></span>
                        <span class="text-xl font-bold text-navy-900" x-text="data ? data.progress + '%' : ''"></span>
                        <span x-show="!data" class="skeleton h-6 w-12"></span>
                    </div>
                    <p class="text-sm" :class="data?.delivery.late ? 'text-amber-800' : 'text-gray-700'" x-text="data?.delivery.text ?? ''"></p>
                    <span x-show="!data" class="skeleton block h-3.5 w-3/4"></span>
                </section>

                <!-- Actie van de klant nodig -->
                <section data-enter class="mb-3 rounded-2xl border border-brand-200 bg-brand-50 p-4" x-show="data?.waiting.length">
                    <h2 class="text-sm font-bold text-navy-900">Actie van <span class="text-brand-600">de klant nodig</span></h2>
                    <p class="mb-3 text-xs text-gray-600">Dit staat bij de klant bovenaan op het scherm.</p>
                    <div class="space-y-2">
                        <template x-for="phase in data?.waiting ?? []" :key="phase.id">
                            <div class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white p-3">
                                <span x-icon="'clock'" class="h-4 w-4 shrink-0 text-brand-600"></span>
                                <span class="min-w-0 flex-1 text-sm text-gray-800" x-text="phase.name"></span>
                                <span class="shrink-0 text-xs text-gray-500">wacht op de klant</span>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- Foto's die de klant ziet -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="text-sm font-bold text-navy-900">Foto's <span class="text-brand-600">die de klant ziet</span></h2>
                    <p class="mb-3 text-xs text-gray-500" x-text="data ? data.photos.visible + ' zichtbaar, ' + data.photos.hidden + ' alleen intern. Zichtbaarheid zet je om bij de foto\'s in het dossier.' : ''"></p>
                    <p x-show="data && data.photos.items.length === 0" class="text-sm text-gray-500">De klant ziet nog geen foto's.</p>
                    <div class="grid grid-cols-3 gap-2" x-show="data?.photos.items.length">
                        <template x-for="photo in data?.photos.items ?? []" :key="photo.id">
                            <button type="button" @click="viewer = photo" class="aspect-square overflow-hidden rounded-xl bg-gray-100" :aria-label="'Foto bekijken' + (photo.caption ? ': ' + photo.caption : '')">
                                <img :src="photoUrl(photo)" alt="" loading="lazy" class="h-full w-full object-cover">
                            </button>
                        </template>
                    </div>
                </section>

                <!-- Wat de klant al heeft afgetekend -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-2 text-sm font-bold text-navy-900">Afgetekend</h2>
                    <p x-show="data && data.approved.length === 0" class="text-sm text-gray-500">De klant heeft nog niets voor gezien en akkoord gezet.</p>
                    <div class="space-y-2">
                        <template x-for="phase in data?.approved ?? []" :key="phase.id">
                            <div class="flex items-start gap-2.5">
                                <span x-icon="'check'" class="mt-0.5 h-4 w-4 shrink-0 text-green-600"></span>
                                <span class="min-w-0">
                                    <span class="block text-sm text-gray-800" x-text="phase.name"></span>
                                    <span class="block text-xs text-gray-500" x-text="phase.sub"></span>
                                </span>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- Deze week -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-2 text-sm font-bold text-navy-900">Deze <span class="text-brand-600">week</span></h2>
                    <p x-show="data && data.week.length === 0" class="text-sm text-gray-500">Niets ingepland deze week.</p>
                    <div class="space-y-2">
                        <template x-for="entry in data?.week ?? []" :key="entry.id">
                            <div class="text-sm">
                                <span class="block text-gray-800" x-text="entry.title"></span>
                                <span class="block text-xs text-gray-500" x-text="entry.sub"></span>
                            </div>
                        </template>
                    </div>
                </section>

                <section data-enter class="app-card mb-3 p-4" x-show="data?.tickets.length">
                    <h2 class="mb-2 text-sm font-bold text-navy-900">Service</h2>
                    <div class="space-y-2">
                        <template x-for="ticket in data?.tickets ?? []" :key="ticket.id">
                            <div class="flex items-center gap-2 text-sm">
                                <span class="min-w-0 flex-1 truncate text-gray-800" x-text="ticket.title"></span>
                                <span class="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-bold" :class="ticket.status.classes" x-text="ticket.status.label"></span>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- Foto groot -->
                <div x-show="viewer" x-cloak data-popup @renovion-back.window="if (viewer) { viewer = null; $event.preventDefault(); }" class="fixed inset-0 z-[70] flex flex-col bg-black pt-safe pb-safe">
                    <template x-if="viewer">
                        <div class="flex h-full flex-col">
                            <div class="flex items-center gap-3 px-4 py-3 text-white">
                                <span class="min-w-0 flex-1 truncate text-sm font-semibold" x-text="viewer.caption ?? ''"></span>
                                <button type="button" @click="viewer = null" class="tap rounded-lg p-2 text-white" aria-label="Sluiten"><span x-icon="'x-mark'" class="h-6 w-6"></span></button>
                            </div>
                            <div class="flex min-h-0 flex-1 items-center justify-center" @click.self="viewer = null">
                                <img :src="photoUrl(viewer)" :alt="viewer.caption ?? ''" class="max-h-full max-w-full object-contain">
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</template>
