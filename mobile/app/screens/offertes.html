<!-- ===== Offertes ===== -->
<template x-if="$store.os.route === 'offertes'">
    <div x-data="quotes" x-effect="data && (statuses = data.statuses)">
        <nav class="app-sectabs" aria-label="Onderdelen van deze sectie">
            <a href="#/offertes" class="on" aria-current="page">Offertes</a>
            <a href="#/calculaties">Calculaties</a>
            <a href="#/prijslijst">Prijslijst</a>
        </nav>

        <div data-enter class="app-ph">
            <p class="sec-eye"><span x-icon="'document-text'"></span> Verkoop</p>
            <h1><em>Offertes</em></h1>
            <p class="sub">
                <span x-show="data" x-text="data ? osFormat.tally(data.total, 'offerte', 'offertes') : ''"></span>
                <span x-show="!data" class="skeleton block h-3.5 w-1/3"></span>
            </p>
            <div class="app-ph-acts">
                <button type="button" @click="$store.os.go(data?.links.create ?? '/offertes/create')" class="tap min-h-11 rounded-lg bg-brand-500 px-4 py-2 text-sm font-bold text-white active:bg-brand-600">
                    <span x-icon="'plus'" class="mr-1.5 h-4 w-4"></span>Offerte
                </button>
                <a href="#/offertedashboard" class="app-btn min-h-11"><span x-icon="'chart-bar'" class="h-4 w-4"></span> Dashboard</a>
            </div>
        </div>

        <!-- Statusfilter: één rij die zijwaarts scrolt -->
        <div class="app-chips -mx-4 !flex-nowrap overflow-x-auto px-4 pb-1 [scrollbar-width:none]">
            <button type="button" @click="setStatus('')" :class="status === '' && 'on'" class="app-chip shrink-0" :aria-pressed="status === ''"><b class="font-semibold">Alle</b></button>
            <template x-for="option in statuses ?? []" :key="option.value">
                <button type="button" @click="setStatus(option.value); $el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' })" :class="status === option.value && 'on'" class="app-chip shrink-0" :aria-pressed="status === option.value">
                    <b class="font-semibold" x-text="option.label"></b>
                </button>
            </template>
        </div>

        <template x-if="failed">
            <div class="app-card p-5 text-center">
                <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                <button type="button" @click="load()" class="app-btn mt-3 min-h-11">Opnieuw proberen</button>
            </div>
        </template>

        <template x-if="data && list.length === 0">
            <div class="app-card p-6 text-center">
                <p class="text-sm text-gray-500">Geen offertes gevonden.</p>
                <button type="button" @click="$store.os.go(data.links.create)" class="app-btn pri mt-3 min-h-11">+ Eerste offerte</button>
            </div>
        </template>

        <div data-enter class="app-card" x-show="!failed && (!data || list.length > 0)">
            <div class="app-card-b">
                <template x-for="i in (data ? 0 : 6)" :key="i">
                    <div class="flex items-center gap-3.5 py-3.5"><span class="skeleton h-9 w-9 shrink-0 !rounded-xl"></span><span class="flex-1"><span class="skeleton mb-2 block h-3.5 w-2/3"></span><span class="skeleton block h-3 w-1/2"></span></span></div>
                </template>
                <template x-for="quote in data ? list : []" :key="quote.id">
                    <button type="button" @click="$store.os.go(quote.path)" class="app-li w-full text-left">
                        <span class="app-ic or"><span x-icon="'document-text'" class="h-[18px] w-[18px]"></span></span>
                        <span class="min-w-0 flex-1">
                            <b class="truncate" x-text="quote.customer"></b>
                            <small class="truncate" x-show="quote.title" x-text="quote.title"></small>
                            <small x-text="quote.sub"></small>
                            <span x-show="quote.signal" class="mt-1 flex items-center gap-1.5 text-xs font-medium" :class="quote.signal?.color === 'red' ? 'text-red-700' : 'text-amber-700'">
                                <span class="h-2 w-2 shrink-0 rounded-full" :class="quote.signal?.color === 'red' ? 'bg-red-500' : 'bg-amber-500'"></span>
                                <span x-text="quote.signal?.text"></span>
                            </span>
                        </span>
                        <span class="mt-0.5 shrink-0 rounded-full px-2.5 py-0.5 text-xs font-semibold whitespace-nowrap" :class="quote.status.classes" x-text="quote.status.label"></span>
                    </button>
                </template>
            </div>
        </div>

        <button type="button" x-show="data && hasMore" x-cloak @click="more()" :disabled="loadingMore" class="app-btn mt-3 min-h-11 w-full justify-center disabled:opacity-60" x-text="loadingMore ? 'Bezig' : 'Meer laden'"></button>
    </div>
</template>
