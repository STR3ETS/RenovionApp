<!-- ===== Prijsaanvragen ===== -->
<template x-if="$store.os.route === 'prijsaanvragen'">
    <div x-data="rfqs">
        <div data-enter class="app-ph">
            <p class="sec-eye"><span x-icon="'scale'"></span> Mensen en partners</p>
            <h1>Prijs<em>aanvragen</em></h1>
            <p class="sub">Werk uitzetten, biedingen vergelijken tegen de begroting en gunnen.</p>
            <div class="app-ph-acts">
                <button type="button" @click="$store.os.go(data?.links.create ?? '/prijsaanvragen/nieuw')" class="tap min-h-11 rounded-lg bg-brand-500 px-4 py-2 text-sm font-bold text-white active:bg-brand-600">
                    <span x-icon="'plus'" class="mr-1.5 h-4 w-4"></span>Nieuwe aanvraag
                </button>
            </div>
        </div>

        <!-- Verplichtingen -->
        <div class="mb-3 grid grid-cols-2 gap-2">
            <div data-enter class="col-span-2 rounded-2xl bg-navy-900 p-4 text-white">
                <p class="text-xs font-semibold text-navy-200">Verplichtingen</p>
                <p class="mt-0.5 text-2xl font-bold" x-show="data" x-text="osFormat.euro(data?.kpis.commitment)"></p>
                <span x-show="!data" class="skeleton mt-1 block h-7 w-1/2"></span>
                <p class="text-xs text-navy-200">gegund aan partners</p>
            </div>
            <div data-enter class="app-card p-4">
                <p class="text-xs font-semibold text-gray-500" x-text="data?.kpis.savings_label ?? 'Onder begroting'"></p>
                <p class="mt-0.5 text-lg font-bold" :class="data?.kpis.over ? 'text-red-600' : 'text-navy-900'" x-show="data" x-text="osFormat.euro(data?.kpis.savings)"></p>
                <span x-show="!data" class="skeleton mt-1 block h-5 w-2/3"></span>
                <p class="text-xs text-gray-500">over alle gunningen</p>
            </div>
            <div data-enter class="app-card p-4">
                <p class="text-xs font-semibold text-gray-500">Uitgezet</p>
                <p class="mt-0.5 text-lg font-bold text-navy-900" x-show="data" x-text="data?.kpis.sent"></p>
                <span x-show="!data" class="skeleton mt-1 block h-5 w-1/3"></span>
                <p class="text-xs text-gray-500">wachten op biedingen</p>
            </div>
        </div>

        <!-- Status: één rij die zijwaarts scrolt -->
        <div class="app-chips -mx-4 !flex-nowrap overflow-x-auto px-4 pb-1 [scrollbar-width:none]" x-show="data">
            <template x-for="tab in data?.tabs ?? []" :key="tab.value">
                <button type="button" @click="setStatus(tab.value)" :class="status === tab.value && 'on'" class="app-chip shrink-0" :aria-pressed="status === tab.value">
                    <b class="font-semibold" x-text="tab.label"></b> <span x-text="tab.count"></span>
                </button>
            </template>
        </div>

        <div class="mb-3" x-show="data?.projects.length">
            <select x-model="project" @change="filter()" aria-label="Project" class="w-full !rounded-xl">
                <option value="">Alle projecten</option>
                <template x-for="item in data?.projects ?? []" :key="item.id">
                    <option :value="String(item.id)" :selected="project === String(item.id)" x-text="item.name"></option>
                </template>
            </select>
        </div>

        <template x-if="failed">
            <div class="app-card p-5 text-center" :class="$data.failGone && 'os-gone'">
                <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                <button type="button" x-show="!$data.failGone" @click="load()" class="app-btn min-h-11 mt-3">Opnieuw proberen</button>
            </div>
        </template>

        <template x-if="data && data.rfqs.length === 0">
            <div class="app-card p-6 text-center">
                <p class="text-sm font-semibold text-navy-900">Nog geen prijsaanvragen</p>
                <p class="mt-1 text-sm text-gray-500">Zet een stuk werk uit bij een paar partners en vergelijk de biedingen.</p>
                <button type="button" @click="$store.os.go(data.links.create)" class="app-btn min-h-11 pri mt-3"><span x-icon="'plus'" class="h-4 w-4"></span> Nieuwe aanvraag</button>
            </div>
        </template>

        <div data-enter class="app-card" x-show="!failed && (!data || data.rfqs.length > 0)">
            <div class="app-card-b">
                <template x-for="i in (data ? 0 : 5)" :key="i">
                    <div class="flex items-center gap-3.5 py-3.5"><span class="skeleton h-10 w-10 shrink-0 !rounded-xl"></span><span class="flex-1"><span class="skeleton mb-2 block h-3.5 w-2/3"></span><span class="skeleton block h-3 w-1/2"></span></span></div>
                </template>
                <template x-for="rfq in data?.rfqs ?? []" :key="rfq.id">
                    <button type="button" @click="$store.os.go(rfq.path)" class="app-li w-full text-left">
                        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl" :class="rfq.overdue ? 'bg-amber-100 text-amber-700' : 'bg-klant-100 text-klant-700'"><span x-icon="'scale'" class="h-5 w-5"></span></span>
                        <span class="min-w-0 flex-1">
                            <b class="truncate" x-text="rfq.title"></b>
                            <small class="truncate" x-text="rfq.sub"></small>
                            <span class="mt-1 flex flex-wrap gap-1">
                                <span class="rounded-full px-2 py-0.5 text-[11px] font-semibold" :class="rfq.status.classes" x-text="rfq.status.label"></span>
                                <span x-show="rfq.overdue" class="rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-semibold text-amber-800">Deadline voorbij</span>
                            </span>
                        </span>
                        <span class="shrink-0 text-right">
                            <b class="block text-sm font-bold whitespace-nowrap text-navy-900" x-text="osFormat.euro(rfq.budget)"></b>
                            <small x-show="rfq.winner" class="block text-xs" :class="rfq.winner?.under ? 'text-green-700' : 'text-red-600'" x-text="rfq.winner ? rfq.winner.name + ', ' + osFormat.euro(rfq.winner.price) : ''"></small>
                            <small x-show="!rfq.winner && rfq.best !== null" class="block text-xs text-gray-500" x-text="'beste ' + osFormat.euro(rfq.best)"></small>
                            <small x-show="!rfq.winner && rfq.best === null" class="block text-xs text-gray-500">begroot</small>
                        </span>
                    </button>
                </template>
            </div>
        </div>
    </div>
</template>

<!-- ===== Prijsaanvraag ===== -->
<template x-if="$store.os.route === 'prijsaanvraag'">
    <div>
        <template x-for="id in [$store.os.param]" :key="id">
            <div x-data="rfq(id)">
                <nav class="app-crumbs mb-2 !text-gray-500">
                    <template x-if="data?.project">
                        <span class="contents">
                            <button type="button" @click="$store.os.go(data.project.path)" class="tap inline-flex min-w-0 items-center gap-1 font-semibold !text-brand-700"><span x-icon="'folder'" class="h-3.5 w-3.5 shrink-0"></span><span class="truncate" x-text="data.project.name"></span></button>
                            <span x-icon="'chevron-right'" class="h-3 w-3 shrink-0"></span>
                        </span>
                    </template>
                    <a x-show="!data?.project" href="#/prijsaanvragen" class="tap">Prijsaanvragen</a>
                    <span x-show="!data?.project" x-icon="'chevron-right'" class="h-3 w-3"></span>
                    <span x-text="data?.number ?? ''"></span>
                </nav>
                <div data-enter class="app-ph">
                    <p class="sec-eye"><span x-icon="'scale'"></span> <span x-text="data?.number ?? 'Prijsaanvraag'"></span></p>
                    <h1><span x-text="data?.title ?? ''"></span><span x-show="!data" class="skeleton inline-block h-7 w-2/3 align-middle"></span></h1>
                    <p class="sub" x-text="data?.subtitle ?? ''"></p>
                    <div class="app-ph-acts" x-show="data">
                        <span class="rounded-full px-3 py-1 text-sm font-semibold" :class="data?.status.classes" x-text="data?.status.label"></span>
                        <span x-show="data?.overdue" class="rounded-full bg-amber-100 px-3 py-1 text-sm font-semibold text-amber-800">Deadline voorbij</span>
                    </div>
                </div>

                <template x-if="failed">
                    <div class="app-card p-5 text-center" :class="$data.failGone && 'os-gone'">
                        <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                        <button type="button" x-show="!$data.failGone" @click="load()" class="app-btn min-h-11 mt-3">Opnieuw proberen</button>
                    </div>
                </template>

                <template x-if="!data && !failed">
                    <div class="space-y-3">
                        <template x-for="i in 3" :key="i">
                            <div class="app-card p-4"><span class="skeleton mb-2 block h-4 w-1/3"></span><span class="skeleton mb-1.5 block h-3 w-full"></span><span class="skeleton block h-3 w-2/3"></span></div>
                        </template>
                    </div>
                </template>

                <!-- Gegund -->
                <section data-enter class="mb-3 rounded-2xl border border-green-200 bg-green-50 p-4" x-show="data?.winner">
                    <h2 class="flex items-center gap-1.5 text-sm font-bold text-green-800"><span x-icon="'check'" class="h-4 w-4"></span> <span x-text="'Gegund aan ' + (data?.winner?.name ?? '')"></span></h2>
                    <p class="mt-1 text-sm text-green-900">
                        <span x-text="osFormat.euro(data?.winner?.price) + ' tegenover ' + osFormat.euro(data?.budget) + ' begroot, dus '"></span>
                        <b :class="data?.winner?.under ? 'text-green-700' : 'text-red-600'" x-text="osFormat.euro(data?.winner?.savings) + (data?.winner?.under ? ' onder' : ' boven')"></b>
                        <span x-text="' de begroting. Opdracht ' + (data?.winner?.order_number ?? '') + ', ' + (data?.winner?.awarded_on ?? '') + '.'"></span>
                    </p>
                </section>

                <!-- Biedingen -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-1 text-sm font-bold text-navy-900">Biedingen</h2>
                    <p class="mb-3 text-xs text-gray-500">Een bieding die niet alle posten prijst, is niet vergelijkbaar. Dat staat bij compleet.</p>
                    <p x-show="data && data.bids.length === 0" class="py-1 text-sm text-gray-500">Nog geen biedingen binnen.</p>
                    <div class="space-y-2">
                        <template x-for="bid in data?.bids ?? []" :key="bid.id">
                            <div class="rounded-xl border p-3" :class="bid.best ? 'border-green-200 bg-green-50' : 'border-gray-200'">
                                <div class="flex items-start gap-3">
                                    <span class="min-w-0 flex-1">
                                        <b class="block text-sm font-semibold text-navy-900" x-text="bid.partner"></b>
                                        <span x-show="bid.conditions" class="block text-xs text-gray-500" x-text="bid.conditions"></span>
                                        <span x-show="bid.partner_issue" class="mt-1 inline-block rounded-full bg-red-100 px-2 py-0.5 text-[11px] font-semibold text-red-800" x-text="bid.partner_issue"></span>
                                    </span>
                                    <b class="shrink-0 text-base font-bold whitespace-nowrap text-navy-900" x-text="osFormat.euro(bid.price)"></b>
                                </div>
                                <div class="mt-2 grid grid-cols-3 gap-2 text-xs">
                                    <div>
                                        <span class="block text-gray-500">Tegen budget</span>
                                        <span x-show="bid.variance !== null" class="mt-0.5 inline-block rounded-full px-2 py-0.5 font-semibold" :class="bid.variance > 0 ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'" x-text="(bid.variance > 0 ? '+' : '') + String(bid.variance).replace('.', ',') + '%'"></span>
                                        <span x-show="bid.variance === null" class="mt-0.5 block text-gray-500">geen budget</span>
                                    </div>
                                    <div>
                                        <span class="block text-gray-500">Start</span>
                                        <b class="mt-0.5 block font-semibold text-navy-900" x-text="bid.start + (bid.days ? ', ' + bid.days + ' dagen' : '')"></b>
                                    </div>
                                    <div>
                                        <span class="block text-gray-500">Compleet</span>
                                        <b class="mt-0.5 block font-semibold" :class="bid.complete ? 'text-green-700' : 'text-amber-700'" x-text="bid.completeness + '%'"></b>
                                    </div>
                                </div>
                                <button type="button" x-show="data?.can_award" @click="award(bid)" :disabled="busy !== null"
                                        class="tap mt-3 flex w-full items-center justify-center gap-1.5 rounded-xl py-2.5 text-sm font-bold disabled:opacity-60"
                                        :class="bid.best ? 'bg-brand-500 text-white active:bg-brand-600' : 'border border-gray-200 bg-white text-navy-900'">
                                    <span x-icon="'check'" class="h-4 w-4"></span>
                                    <span x-text="busy === 'award:' + bid.id ? 'Bezig' : 'Gunnen'"></span>
                                </button>
                            </div>
                        </template>
                    </div>

                    <!-- Bieding vastleggen -->
                    <form x-show="data?.can_bid" @submit.prevent="saveBid()" class="mt-4 space-y-2 border-t border-gray-100 pt-4">
                        <h3 class="text-sm font-bold text-navy-900">Bieding vastleggen</h3>
                        <label class="block">
                            <span class="app-lbl">Partner</span>
                            <select x-model="bid.subcontractor_id" class="w-full !rounded-xl">
                                <template x-for="partner in data?.invited ?? []" :key="partner.id">
                                    <option :value="String(partner.id)" x-text="partner.name"></option>
                                </template>
                            </select>
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="block">
                                <span class="app-lbl">Prijs</span>
                                <input type="number" inputmode="decimal" step="0.01" min="0" x-model="bid.price" required placeholder="EUR" class="w-full !rounded-xl">
                            </label>
                            <label class="block">
                                <span class="app-lbl">Compleet %</span>
                                <input type="number" inputmode="numeric" min="0" max="100" x-model="bid.completeness" class="w-full !rounded-xl">
                            </label>
                        </div>
                        <label class="block">
                            <span class="app-lbl">Kan starten op</span>
                            <input type="date" x-model="bid.can_start_on" class="w-full !rounded-xl">
                        </label>
                        <label class="block">
                            <span class="app-lbl">Voorwaarden</span>
                            <input type="text" x-model="bid.conditions" maxlength="2000" placeholder="Bijvoorbeeld: exclusief steiger en afvoer" class="w-full !rounded-xl">
                        </label>
                        <button type="submit" :disabled="busy !== null || bid.price === ''" class="app-btn min-h-11 pri w-full justify-center disabled:opacity-60" x-text="busy === 'bid' ? 'Bezig' : 'Vastleggen'"></button>
                    </form>
                </section>

                <!-- Werkomschrijving -->
                <section data-enter class="app-card mb-3 p-4" x-show="data?.scope && !editing">
                    <h2 class="mb-1 text-sm font-bold text-navy-900">Werkomschrijving</h2>
                    <p class="text-sm whitespace-pre-line text-gray-700" x-text="data?.scope"></p>
                </section>

                <!-- Uitgenodigd -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-2 text-sm font-bold text-navy-900">Uitgenodigd</h2>
                    <p x-show="data && data.invited.length === 0" class="mb-2 text-sm text-gray-500">Nog niemand uitgenodigd.</p>
                    <ul class="mb-1 divide-y divide-gray-100">
                        <template x-for="partner in data?.invited ?? []" :key="partner.id">
                            <li class="flex items-center gap-2 py-2 text-sm">
                                <span class="min-w-0 flex-1 truncate text-navy-900" x-text="partner.name"></span>
                                <span class="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-semibold" :class="partner.bid ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'" x-text="partner.bid ? 'Bood' : 'Wacht'"></span>
                            </li>
                        </template>
                    </ul>

                    <div x-show="data?.can_invite" class="mt-2 border-t border-gray-100 pt-3">
                        <p class="mb-2 text-xs text-gray-500">Partijen met een rond dossier kun je uitnodigen.</p>
                        <div class="max-h-72 space-y-1 overflow-y-auto">
                            <template x-for="partner in data?.candidates ?? []" :key="partner.id">
                                <button type="button" @click="toggleInvite(partner.id)" :aria-pressed="invite.includes(partner.id)"
                                        class="tap flex min-h-11 w-full items-center gap-3 rounded-xl border px-3 py-2 text-left text-sm"
                                        :class="invite.includes(partner.id) ? 'border-brand-300 bg-brand-50' : 'border-gray-200 bg-white'">
                                    <span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-md border" :class="invite.includes(partner.id) ? 'border-brand-500 bg-brand-500 text-white' : 'border-gray-300'">
                                        <span x-show="invite.includes(partner.id)" x-icon="'check'" class="h-3.5 w-3.5"></span>
                                    </span>
                                    <span class="min-w-0 flex-1 truncate text-navy-900" x-text="partner.name"></span>
                                    <span x-show="partner.warning" class="shrink-0 rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-semibold text-amber-800" x-text="partner.warning"></span>
                                </button>
                            </template>
                        </div>
                        <button type="button" @click="sendInvites()" :disabled="busy !== null || invite.length === 0" class="app-btn min-h-11 pri mt-3 w-full justify-center disabled:opacity-60">
                            <span x-icon="'paper-airplane'" class="h-4 w-4"></span>
                            <span x-text="busy === 'invite' ? 'Bezig' : (invite.length ? 'Uitzetten (' + invite.length + ')' : 'Uitzetten')"></span>
                        </button>
                    </div>
                </section>

                <!-- Aanvraag -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <div class="mb-2 flex items-center justify-between gap-2">
                        <h2 class="text-sm font-bold text-navy-900">Aanvraag</h2>
                        <button type="button" x-show="!editing" @click="startEdit()" class="tap -my-2 min-h-11 px-3 text-xs font-semibold text-brand-700">Bewerken</button>
                    </div>
                    <div x-show="!editing" class="app-fields !mt-0">
                        <div><span class="app-lbl">Budget uit de begroting</span><b x-text="osFormat.euro(data?.form.budget, 2)"></b></div>
                        <div><span class="app-lbl">Deadline biedingen</span><b x-text="data?.form.deadline ? new Date(data.form.deadline + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }) : '-'"></b></div>
                        <div><span class="app-lbl">Gewenste start</span><b x-text="data?.form.starts_on ? new Date(data.form.starts_on + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }) : '-'"></b></div>
                        <div><span class="app-lbl">Werkomschrijving</span><b x-text="data?.form.scope ? 'Ingevuld' : '-'"></b></div>
                    </div>
                    <form x-show="editing" @submit.prevent="save()" class="space-y-2">
                        <label class="block">
                            <span class="app-lbl">Budget uit de begroting</span>
                            <input type="number" inputmode="decimal" step="0.01" min="0" x-model="form.budget" class="w-full !rounded-xl">
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="block">
                                <span class="app-lbl">Deadline biedingen</span>
                                <input type="date" x-model="form.deadline" class="w-full !rounded-xl">
                            </label>
                            <label class="block">
                                <span class="app-lbl">Gewenste start</span>
                                <input type="date" x-model="form.starts_on" class="w-full !rounded-xl">
                            </label>
                        </div>
                        <label class="block">
                            <span class="app-lbl">Werkomschrijving</span>
                            <textarea x-model="form.scope" rows="5" maxlength="5000" class="w-full !rounded-xl"></textarea>
                        </label>
                        <div class="flex gap-2">
                            <button type="submit" :disabled="busy !== null" class="app-btn min-h-11 pri flex-1 justify-center disabled:opacity-60" x-text="busy === 'save' ? 'Bezig' : 'Opslaan'"></button>
                            <button type="button" @click="editing = false" class="app-btn min-h-11 ghost">Annuleren</button>
                        </div>
                    </form>
                </section>

                <button type="button" x-show="data" @click="$store.os.go(data.links.project)" class="app-btn min-h-11 ghost w-full justify-center"><span x-icon="'folder'" class="h-4 w-4"></span> Naar het project</button>
            </div>
        </template>
    </div>
</template>
