<!-- ===== Aan de slag: uitleg per rol, checklist voor kantoor ===== -->
<template x-if="$store.os.route === 'aandeslag'">
    <div x-data="onboarding">
        <div data-enter class="app-ph">
            <p class="sec-eye"><span x-icon="'rocket-launch'"></span> Welkom</p>
            <h1>Aan de <em>slag</em></h1>
            <p class="sub" x-text="data?.hero.subtitle ?? ''"></p>
            <div class="app-ph-acts" x-show="data">
                <button type="button" @click="toggleMenu()" :disabled="busy" class="app-btn min-h-11 disabled:opacity-60">
                    <span x-icon="data?.dismissed ? 'sparkles' : 'check'" class="h-4 w-4"></span>
                    <span x-text="busy ? 'Bezig' : (data?.dismissed ? 'Weer in het menu tonen' : 'Uit het menu halen')"></span>
                </button>
            </div>
        </div>

        <template x-if="failed">
            <div class="app-card mb-3 p-5 text-center">
                <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                <button type="button" x-show="!$data.failGone" @click="load()" class="app-btn mt-3 min-h-11">Opnieuw proberen</button>
            </div>
        </template>

        <!-- Hero: de belofte en de voortgang van de checklist (kantoor) of het vaste ritme (uitvoerder) -->
        <section data-enter class="mb-4 overflow-hidden rounded-2xl bg-navy-950 p-5 text-white" x-show="!failed">
            <template x-if="!data">
                <div><span class="skeleton skeleton-dark mb-2 block h-3 w-1/2"></span><span class="skeleton skeleton-dark mb-3 block h-6 w-3/4"></span><span class="skeleton skeleton-dark mb-2 block h-3 w-full"></span><span class="skeleton skeleton-dark block h-3 w-5/6"></span></div>
            </template>
            <template x-if="data">
                <div>
                    <p class="text-[11px] font-bold tracking-widest text-brand-300 uppercase">Eén omgeving voor het hele proces</p>
                    <h2 class="mt-1 text-xl font-bold !text-white" x-text="data.hero.title"></h2>
                    <p class="mt-2 text-sm leading-relaxed text-white/80" x-text="data.hero.intro"></p>

                    <div x-show="data.progress" class="mt-4 rounded-xl bg-white/10 p-4">
                        <div class="flex items-baseline justify-between gap-3">
                            <p class="text-[11px] font-bold tracking-widest text-white/70 uppercase">Checklist</p>
                            <p class="text-2xl font-bold"><span x-text="data.progress?.done"></span><span class="text-sm font-medium text-white/70" x-text="' van ' + data.progress?.total"></span></p>
                        </div>
                        <div class="mt-2 h-2 overflow-hidden rounded-full bg-white/15" role="progressbar" aria-valuemin="0" :aria-valuemax="data.progress?.total" :aria-valuenow="data.progress?.done" aria-label="Voortgang van de checklist">
                            <div class="h-full rounded-full bg-brand-500" :style="`width: ${data.progress?.percentage ?? 0}%`"></div>
                        </div>
                        <p class="mt-2 text-sm text-white/80" x-text="data.progress?.complete ? 'Alles staat. Jullie kunnen beginnen.' : osFormat.tally(data.progress?.open ?? 0, 'stap', 'stappen') + ' nog te doen.'"></p>
                        <button type="button" @click="toChecklist()" class="mt-3 flex min-h-11 w-full items-center justify-center rounded-xl bg-brand-500 text-sm font-bold text-white active:bg-brand-600">Naar de checklist</button>
                    </div>

                    <div x-show="data.rhythm.length" class="mt-4 rounded-xl bg-white/10 p-4">
                        <p class="text-[11px] font-bold tracking-widest text-white/70 uppercase">Je vaste ritme</p>
                        <ol class="mt-2 space-y-1.5 text-sm text-white/90">
                            <template x-for="(line, index) in data.rhythm" :key="index">
                                <li class="flex gap-2"><span class="font-bold text-brand-300" x-text="index + 1"></span> <span x-text="line"></span></li>
                            </template>
                        </ol>
                    </div>
                </div>
            </template>
        </section>

        <!-- Zo werkt het -->
        <section class="mb-5" x-show="data">
            <p class="px-1 text-[11px] font-bold tracking-widest text-gray-500 uppercase">Zo werkt het</p>
            <h2 class="mt-0.5 px-1 text-lg font-bold text-navy-900" x-text="data ? (data.crm ? 'Van aanvraag tot nazorg in ' : 'Jouw dag in ') + data.flow.length + ' stappen' : ''"></h2>
            <p class="mt-0.5 mb-3 px-1 text-sm text-gray-600" x-text="data?.crm ? 'Elke stap bouwt voort op de vorige. Wat eenmaal is ingevoerd, hoef je nergens opnieuw te typen.' : 'Meer is het niet. Alles wat je invult ziet kantoor direct.'"></p>
            <ol class="space-y-2">
                <template x-for="(step, index) in data?.flow ?? []" :key="index">
                    <li data-enter class="app-card flex gap-3 p-4">
                        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl" :class="step.classes"><span x-icon="step.icon" class="h-5 w-5"></span></span>
                        <span class="min-w-0 flex-1">
                            <span class="text-[11px] font-bold tracking-widest text-gray-500 uppercase" x-text="'Stap ' + (index + 1)"></span>
                            <span class="block font-semibold text-navy-900" x-text="step.title"></span>
                            <span class="mt-0.5 block text-sm leading-relaxed text-gray-600" x-text="step.text"></span>
                        </span>
                    </li>
                </template>
            </ol>
        </section>

        <!-- Checklist: wat er moet staan om te beginnen (kantoor) -->
        <section class="mb-5 scroll-mt-[calc(72px_+_env(safe-area-inset-top))]" x-ref="checklist" x-show="data?.items.length">
            <p class="px-1 text-[11px] font-bold tracking-widest text-brand-700 uppercase">Checklist</p>
            <h2 class="mt-0.5 px-1 text-lg font-bold text-navy-900">Instellen om te beginnen</h2>
            <p class="mt-0.5 mb-3 px-1 text-sm text-gray-600">De status wordt live berekend uit de instellingen en de gegevens. Stappen met "optioneel" mogen later.</p>
            <ol class="space-y-2">
                <template x-for="(item, index) in data?.items ?? []" :key="item.key">
                    <li data-enter class="app-card p-4">
                        <div class="flex items-start gap-3">
                            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-sm font-bold" :class="item.done ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'" aria-hidden="true">
                                <span x-show="item.done" x-icon="'check'" class="h-4 w-4"></span>
                                <span x-show="!item.done" x-text="index + 1"></span>
                            </span>
                            <span class="min-w-0 flex-1">
                                <span class="flex flex-wrap items-center gap-1.5">
                                    <span class="text-sm font-semibold text-navy-900" x-text="item.title"></span>
                                    <span x-show="item.done" class="rounded-full bg-green-100 px-2 py-0.5 text-[11px] font-semibold text-green-800">Klaar</span>
                                    <span x-show="!item.done && item.optional" class="rounded-full bg-gray-100 px-2 py-0.5 text-[11px] font-semibold text-gray-700">Optioneel</span>
                                    <span x-show="!item.done && !item.optional" class="rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-semibold text-amber-800">Nog te doen</span>
                                </span>
                                <span class="mt-1 block text-xs leading-relaxed text-gray-600" x-text="item.description"></span>
                                <span x-show="item.note" class="mt-0.5 block text-[11px] text-gray-500" x-text="item.note"></span>
                            </span>
                        </div>
                        <button type="button" x-show="item.path" @click="$store.os.go(item.path)"
                                class="mt-3 flex min-h-11 w-full items-center justify-center gap-1.5 rounded-xl text-sm font-semibold"
                                :class="item.done ? 'border border-gray-200 bg-white text-navy-900' : 'bg-brand-500 font-bold text-white active:bg-brand-600'">
                            <span x-text="item.action"></span> <span x-icon="'arrow-right'" class="h-4 w-4"></span>
                        </button>
                    </li>
                </template>
            </ol>
        </section>

        <!-- Waar je wat vindt -->
        <section class="mb-5" x-show="data">
            <p class="px-1 text-[11px] font-bold tracking-widest text-gray-500 uppercase">Onderdelen</p>
            <h2 class="mt-0.5 px-1 text-lg font-bold text-navy-900">Waar je wat vindt</h2>
            <p class="mt-0.5 mb-3 px-1 text-sm text-gray-600" x-text="data?.crm ? 'In de volgorde van het menu. Tik op een kaart om er direct heen te gaan.' : 'Dit zijn de knoppen in de balk onderin.'"></p>
            <div class="app-card">
                <div class="app-card-b">
                    <template x-for="module in data?.modules ?? []" :key="module.title">
                        <button type="button" @click="module.path && $store.os.go(module.path)" class="app-li w-full text-left">
                            <span class="app-ic" :class="module.classes"><span x-icon="module.icon" class="h-[18px] w-[18px]"></span></span>
                            <span class="min-w-0 flex-1">
                                <b x-text="module.title"></b>
                                <small x-text="module.text"></small>
                            </span>
                            <span x-show="module.path" x-icon="'chevron-right'" class="mt-2.5 h-4 w-4 shrink-0 text-gray-400"></span>
                        </button>
                    </template>
                </div>
            </div>
        </section>

        <!-- Nova (kantoor) -->
        <section data-enter class="app-card mb-5 p-4" x-show="data?.nova.length">
            <div class="flex items-center gap-3">
                <img :src="$store.os.novaUrl" alt="" class="h-12 w-12 shrink-0 rounded-full object-cover ring-2 ring-brand-500">
                <div class="min-w-0">
                    <p class="text-[11px] font-bold tracking-widest text-brand-700 uppercase">Nova</p>
                    <h2 class="text-lg font-bold text-navy-900">Stelt voor, jij bevestigt</h2>
                </div>
            </div>
            <p class="mt-2 text-sm leading-relaxed text-gray-600">Nova is de assistent in het oranje rondje. Alles wat Nova maakt is een concept dat jij eerst ziet en bevestigt. Pas daarna gebeurt er iets, en dat wordt altijd vastgelegd.</p>
            <div class="mt-3 space-y-3">
                <template x-for="item in data?.nova ?? []" :key="item.title">
                    <div class="flex gap-3">
                        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" :class="item.classes"><span x-icon="item.icon" class="h-4 w-4"></span></span>
                        <span class="min-w-0"><span class="block text-sm font-semibold text-navy-900" x-text="item.title"></span><span class="block text-xs text-gray-600" x-text="item.text"></span></span>
                    </div>
                </template>
            </div>
            <div x-show="data?.automations.length" class="mt-4 rounded-xl bg-gray-50 p-3">
                <p class="text-xs font-semibold text-navy-900">Waar Nova op let (automations, elke 15 minuten)</p>
                <ul class="mt-2 space-y-1.5">
                    <template x-for="automation in data?.automations ?? []" :key="automation.name">
                        <li class="flex gap-2 text-xs text-gray-600">
                            <span x-icon="'bolt'" class="mt-0.5 h-3.5 w-3.5 shrink-0 text-brand-600"></span>
                            <span><span class="font-semibold text-navy-900" x-text="automation.name + '.'"></span> <span x-text="automation.description"></span></span>
                        </li>
                    </template>
                </ul>
                <button type="button" x-show="data?.automations_path" @click="$store.os.go(data.automations_path)" class="mt-2 flex min-h-11 items-center gap-1 text-xs font-semibold text-brand-700">
                    Modus per regel instellen <span x-icon="'arrow-right'" class="h-3.5 w-3.5"></span>
                </button>
            </div>
        </section>

        <!-- Goed om te weten -->
        <section class="mb-4" x-show="data">
            <p class="px-1 text-[11px] font-bold tracking-widest text-gray-500 uppercase">Goed om te weten</p>
            <h2 class="mt-0.5 mb-3 px-1 text-lg font-bold text-navy-900">Voordat je begint</h2>
            <div class="space-y-2">
                <template x-for="tip in data?.tips ?? []" :key="tip.title">
                    <div data-enter class="app-card flex gap-3 p-4">
                        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-gray-100 text-gray-700"><span x-icon="tip.icon" class="h-[18px] w-[18px]"></span></span>
                        <span class="min-w-0">
                            <span class="block text-sm font-semibold text-navy-900" x-text="tip.title"></span>
                            <span class="mt-0.5 block text-xs leading-relaxed text-gray-600" x-text="tip.text"></span>
                        </span>
                    </div>
                </template>
            </div>
        </section>
    </div>
</template>
