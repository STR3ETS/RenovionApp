<!-- ===== Kwaliteit en oplevering ===== -->
<template x-if="$store.os.route === 'kwaliteit'">
    <div x-data="qualityList">
        <div data-enter class="app-ph">
            <p class="sec-eye"><span x-icon="'shield-check'"></span> Projecten</p>
            <h1>Kwaliteit en <em>oplevering</em></h1>
            <p class="sub">Acht stappen van werk afgerond tot nazorg. Elke stap heeft een harde voorwaarde.</p>
        </div>

        <div x-show="data?.open_snags > 0" class="mb-3 flex items-start gap-3 rounded-2xl border border-amber-200 bg-amber-50 p-4">
            <span x-icon="'exclamation-triangle'" class="h-5 w-5 shrink-0 text-amber-700"></span>
            <p class="text-sm text-amber-900">
                <b x-text="data ? data.open_snags + (data.open_snags === 1 ? ' restpunt staat' : ' restpunten staan') + ' open.' : ''"></b>
                Zolang die er zijn, kun je niet naar de klantinspectie.
            </p>
        </div>

        <template x-if="failed">
            <div class="app-card p-5 text-center">
                <p class="text-sm font-semibold text-navy-900">Geen verbinding met de server</p>
                <button type="button" @click="load()" class="app-btn mt-3">Opnieuw proberen</button>
            </div>
        </template>

        <div class="space-y-3" x-show="!data && !failed">
            <template x-for="i in 3" :key="i">
                <div class="app-card p-4"><span class="skeleton mb-2 block h-4 w-2/3"></span><span class="skeleton mb-3 block h-3 w-1/2"></span><span class="skeleton block h-1.5 w-full"></span></div>
            </template>
        </div>

        <div x-show="data && !data.projects.length" class="app-card p-6 text-center">
            <span class="mx-auto mb-2 flex h-11 w-11 items-center justify-center rounded-full bg-green-100 text-green-700"><span x-icon="'shield-check'" class="h-5 w-5"></span></span>
            <p class="text-sm font-semibold text-navy-900">Geen lopende projecten</p>
            <p class="mt-1 text-xs text-gray-500">Zodra er een project loopt, staat de opleverketen hier klaar.</p>
        </div>

        <div class="space-y-3">
            <template x-for="project in data?.projects ?? []" :key="project.id">
                <a :href="'#/oplevering/' + project.id" data-enter class="app-card block p-4 active:bg-gray-50">
                    <span class="flex items-center gap-3">
                        <span class="app-ic ok"><span x-icon="'shield-check'" class="h-5 w-5"></span></span>
                        <span class="min-w-0 flex-1">
                            <b class="block truncate text-sm font-bold text-navy-900" x-text="project.name"></b>
                            <small class="block text-xs text-gray-500" x-text="project.sub"></small>
                        </span>
                    </span>
                    <span class="mt-2 flex flex-wrap gap-1.5" x-show="project.open_snags || project.wkb">
                        <span x-show="project.open_snags" class="rounded-full bg-amber-100 px-2.5 py-0.5 text-[11px] font-bold text-amber-800" x-text="project.open_snags + (project.open_snags === 1 ? ' restpunt' : ' restpunten')"></span>
                        <span x-show="project.wkb" class="rounded-full bg-gray-200 px-2.5 py-0.5 text-[11px] font-bold text-gray-700" title="Valt onder de Wet kwaliteitsborging">Wkb</span>
                    </span>
                    <!-- De acht stappen -->
                    <span class="mt-3 flex gap-1">
                        <template x-for="index in data.steps" :key="index">
                            <span class="h-1.5 flex-1 rounded-full" :class="index - 1 <= project.step ? 'bg-green-600' : 'bg-gray-200'"></span>
                        </template>
                    </span>
                </a>
            </template>
        </div>
    </div>
</template>

<!-- ===== Oplevering van een project ===== -->
<template x-if="$store.os.route === 'oplevering'">
    <div>
        <template x-for="id in [$store.os.param]" :key="id">
            <div x-data="quality(id)" class="pb-4">
                <nav class="app-crumbs mb-2 !text-gray-500">
                    <template x-if="data?.project">
                        <span class="contents">
                            <button type="button" @click="$store.os.go(data.project.path)" class="tap inline-flex min-w-0 items-center gap-1 font-semibold !text-brand-700"><span x-icon="'folder'" class="h-3.5 w-3.5 shrink-0"></span><span class="truncate" x-text="data.project.name"></span></button>
                            <span x-icon="'chevron-right'" class="h-3 w-3 shrink-0"></span>
                        </span>
                    </template>
                    <span>Kwaliteit en oplevering</span>
                </nav>

                <div data-enter class="app-ph">
                    <p class="sec-eye"><span x-icon="'shield-check'"></span> Kwaliteit en oplevering</p>
                    <h1><span x-text="data?.project.name ?? ''"></span><span x-show="!data" class="skeleton inline-block h-7 w-2/3 align-middle"></span></h1>
                    <p class="sub" x-text="data?.subtitle ?? ''"></p>
                    <div class="app-ph-acts" x-show="data">
                        <span class="rounded-full bg-green-100 px-3 py-1 text-sm font-semibold text-green-800" x-text="data ? 'Stap ' + (data.step + 1) + ' van ' + data.steps : ''"></span>
                    </div>
                </div>

                <template x-if="failed">
                    <div class="app-card mb-3 p-5 text-center">
                        <p class="text-sm font-semibold text-navy-900">Geen verbinding met de server</p>
                        <button type="button" @click="load()" class="app-btn mt-3">Opnieuw proberen</button>
                    </div>
                </template>

                <!-- De opleverketen -->
                <section data-enter class="app-card mb-3 p-4" x-show="!failed">
                    <h2 class="mb-3 text-sm font-bold text-navy-900">Opleverketen</h2>
                    <template x-if="!data"><div class="space-y-2"><span class="skeleton block h-12 w-full"></span><span class="skeleton block h-12 w-full"></span><span class="skeleton block h-12 w-full"></span></div></template>
                    <div class="space-y-2">
                        <template x-for="(item, index) in data?.flow ?? []" :key="index">
                            <div class="flex items-start gap-3 rounded-xl border p-3" :class="item.state === 'current' ? 'border-brand-300 bg-brand-50' : 'border-gray-200'">
                                <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-bold"
                                      :class="{ done: 'bg-green-100 text-green-700', current: 'bg-brand-500 text-white', todo: 'bg-gray-100 text-gray-500' }[item.state]">
                                    <span x-show="item.state === 'done'" x-icon="'check'" class="h-3.5 w-3.5"></span>
                                    <span x-show="item.state !== 'done'" x-text="index + 1"></span>
                                </span>
                                <span class="min-w-0 flex-1">
                                    <b class="block text-sm font-semibold" :class="item.state === 'todo' ? 'text-gray-500' : 'text-navy-900'" x-text="item.label"></b>
                                    <small class="block text-xs text-gray-500" x-text="item.condition"></small>
                                </span>
                            </div>
                        </template>
                    </div>
                    <template x-if="data?.can_manage && !data.delivered">
                        <div class="mt-3 border-t border-gray-100 pt-3">
                            <div x-show="data.blocker" class="mb-3 flex items-start gap-2.5 rounded-xl border border-amber-200 bg-amber-50 p-3">
                                <span x-icon="'exclamation-triangle'" class="h-5 w-5 shrink-0 text-amber-700"></span>
                                <p class="text-sm text-amber-900" x-text="data.blocker"></p>
                            </div>
                            <button type="button" @click="advance()" :disabled="!!data.blocker || busy !== null" class="flex min-h-11 w-full items-center justify-center gap-1.5 rounded-xl bg-brand-500 text-sm font-bold text-white active:bg-brand-600 disabled:opacity-40">
                                <span x-icon="'check'" class="h-4 w-4"></span> <span x-text="busy === 'advance' ? 'Bezig' : data.advance"></span>
                            </button>
                        </div>
                    </template>
                </section>

                <!-- Controlepunten -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-1 text-sm font-bold text-navy-900">Controlepunten</h2>
                    <p class="mb-3 text-xs text-gray-500" x-text="data ? 'Dit zijn de dingen die je achteraf niet meer kunt vaststellen. ' + data.checks_done + ' van ' + data.checks.length + ' afgevinkt.' : ''"></p>
                    <div class="space-y-1.5">
                        <template x-for="check in data?.checks ?? []" :key="check.id">
                            <div>
                                <template x-if="data.can_manage">
                                    <button type="button" @click="toggleCheck(check)" :disabled="busy !== null" class="flex min-h-12 w-full items-center gap-3 rounded-xl border border-gray-200 p-3 text-left disabled:opacity-60" :aria-pressed="check.checked">
                                        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border-2" :class="check.checked ? 'border-green-600 bg-green-600 text-white' : 'border-gray-300'">
                                            <span x-show="check.checked" x-icon="'check'" class="h-4 w-4"></span>
                                        </span>
                                        <span class="min-w-0 flex-1">
                                            <b class="block text-sm" :class="check.checked ? 'text-gray-600' : 'text-navy-900'" x-text="check.title"></b>
                                            <small x-show="check.meta" class="block text-xs text-gray-500" x-text="check.meta"></small>
                                        </span>
                                        <span x-show="check.wkb" class="shrink-0 rounded bg-gray-200 px-1.5 py-0.5 text-[10px] font-bold text-gray-700">Wkb</span>
                                    </button>
                                </template>
                                <template x-if="!data.can_manage">
                                    <div class="flex items-center gap-3 rounded-xl border border-gray-200 p-3">
                                        <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full" :class="check.checked ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-400'"><span x-icon="'check'" class="h-3.5 w-3.5"></span></span>
                                        <span class="min-w-0 flex-1">
                                            <b class="block text-sm" :class="check.checked ? 'text-gray-600' : 'text-navy-900'" x-text="check.title"></b>
                                            <small x-show="check.meta" class="block text-xs text-gray-500" x-text="check.meta"></small>
                                        </span>
                                        <span x-show="check.wkb" class="shrink-0 rounded bg-gray-200 px-1.5 py-0.5 text-[10px] font-bold text-gray-700">Wkb</span>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- Restpunten -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-1 text-sm font-bold text-navy-900">Restpunten</h2>
                    <p class="mb-3 text-xs text-gray-500" x-text="data ? data.snags_open + ' open van ' + data.snags.length + '. Een restpunt zonder locatie is onvindbaar voor wie het moet herstellen.' : ''"></p>
                    <p x-show="data && !data.snags.length" class="text-sm text-gray-500">Nog geen restpunten vastgelegd.</p>
                    <div class="space-y-2">
                        <template x-for="snag in data?.snags ?? []" :key="snag.id">
                            <div class="rounded-xl border p-3" :class="snag.overdue ? 'border-red-300' : 'border-gray-200'">
                                <span class="flex flex-wrap items-center gap-1.5">
                                    <b class="text-sm font-semibold text-navy-900" x-text="snag.title"></b>
                                    <span class="rounded-full px-2 py-0.5 text-[10px] font-bold" :class="snag.status.classes" x-text="snag.status.label"></span>
                                    <span x-show="snag.customer" class="rounded-full bg-green-100 px-2 py-0.5 text-[10px] font-bold text-green-800">Van de klant</span>
                                </span>
                                <small class="mt-0.5 block text-xs" :class="snag.overdue ? 'text-red-700' : 'text-gray-500'" x-text="snag.sub"></small>
                                <small x-show="snag.description" class="mt-1 block text-xs text-gray-600" x-text="snag.description"></small>
                                <div x-show="data.can_manage" class="mt-2 flex flex-wrap gap-2 border-t border-gray-100 pt-2">
                                    <template x-for="status in data.snag_statuses.filter((option) => option.value !== snag.status.value)" :key="status.value">
                                        <button type="button" @click="setSnag(snag, status)" :disabled="busy !== null" class="tap min-h-9 rounded-lg border border-gray-300 px-2.5 text-xs font-semibold text-gray-700 disabled:opacity-60" x-text="status.label"></button>
                                    </template>
                                    <button type="button" @click="removeSnag(snag)" :disabled="busy !== null" class="tap ml-auto flex h-9 w-9 items-center justify-center rounded-lg text-gray-400 active:text-red-600" :aria-label="'Restpunt ' + snag.title + ' verwijderen'"><span x-icon="'trash'" class="h-4 w-4"></span></button>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Restpunt vastleggen (projectleiding) -->
                    <form x-show="data?.can_manage" @submit.prevent="addSnag()" class="mt-4 space-y-2 border-t border-gray-100 pt-4">
                        <input type="text" x-model="snag.title" required maxlength="200" placeholder="Wat is er niet in orde?" aria-label="Wat is er niet in orde?" class="w-full">
                        <input type="text" x-model="snag.location" maxlength="160" placeholder="Waar precies, bijvoorbeeld: badkamer, achterwand" aria-label="Locatie" class="w-full">
                        <div class="grid grid-cols-2 gap-2">
                            <select x-model="snag.assigned_to" aria-label="Eigen mens" class="w-full">
                                <option value="">Eigen mens</option>
                                <template x-for="person in data?.people ?? []" :key="person.id"><option :value="person.id" x-text="person.name"></option></template>
                            </select>
                            <select x-model="snag.subcontractor_id" aria-label="Of een partner" class="w-full">
                                <option value="">Of een partner</option>
                                <template x-for="partner in data?.partners ?? []" :key="partner.id"><option :value="partner.id" x-text="partner.name"></option></template>
                            </select>
                        </div>
                        <label class="block"><span class="mb-1 block text-sm font-semibold text-gray-700">Herstellen voor</span><input type="date" x-model="snag.due_on" class="w-full"></label>
                        <label class="flex min-h-11 items-center gap-2 text-sm text-gray-700">
                            <input type="checkbox" x-model="snag.customer" class="h-5 w-5 rounded border-gray-300 text-brand-500"> Door de klant gemeld
                        </label>
                        <button type="submit" :disabled="busy !== null || !snag.title.trim()" class="min-h-11 w-full rounded-xl bg-brand-500 text-sm font-bold text-white active:bg-brand-600 disabled:opacity-60" x-text="busy === 'snag' ? 'Bezig' : 'Restpunt vastleggen'"></button>
                    </form>
                </section>

                <!-- Opleverformulier -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-2 text-sm font-bold text-navy-900">Opleverformulier</h2>
                    <template x-if="data?.signed">
                        <div>
                            <p class="flex items-center gap-2 text-sm font-semibold text-green-800"><span x-icon="'check'" class="h-5 w-5"></span> Getekend</p>
                            <p class="mt-1 text-sm text-navy-900" x-text="data.signed.name"></p>
                            <p class="text-xs text-gray-500" x-text="data.signed.at"></p>
                        </div>
                    </template>
                    <template x-if="data && !data.signed">
                        <div>
                            <p class="mb-3 text-sm text-gray-500">Nog niet getekend. Dit is voorwaarde voor stap zes.</p>
                            <form x-show="data.can_manage" @submit.prevent="sign()" class="space-y-2">
                                <input type="text" x-model="signedName" required maxlength="120" placeholder="Naam van wie tekent" aria-label="Naam van wie tekent" class="w-full">
                                <button type="submit" :disabled="busy !== null || !signedName.trim()" class="min-h-11 w-full rounded-xl bg-brand-500 text-sm font-bold text-white active:bg-brand-600 disabled:opacity-60" x-text="busy === 'sign' ? 'Bezig' : 'Vastleggen'"></button>
                            </form>
                        </div>
                    </template>
                </section>

                <!-- Opleverrapport (stap 7): opmaken of openen, zoals op het overzicht van het dossier -->
                <section data-enter class="app-card mb-3 p-4" x-show="data && (data.report || data.can_manage)">
                    <h2 class="mb-2 text-sm font-bold text-navy-900">Opleverrapport</h2>
                    <template x-if="data?.report">
                        <div>
                            <p class="mb-3 text-sm text-gray-500" x-text="data.report.sub"></p>
                            <button type="button" @click="$store.os.go(data.report.path)" class="app-btn w-full justify-center"><span x-icon="'document-text'" class="h-4 w-4"></span> Rapport openen</button>
                        </div>
                    </template>
                    <template x-if="data && !data.report">
                        <div>
                            <p class="mb-3 text-sm text-gray-500">Nog geen rapport. Dat bevriest de scope, het bewijs en de restpunten.</p>
                            <button type="button" @click="makeReport()" :disabled="busy !== null" class="min-h-11 w-full rounded-xl bg-brand-500 text-sm font-bold text-white active:bg-brand-600 disabled:opacity-60" x-text="busy === 'report' ? 'Bezig' : 'Concept opmaken'"></button>
                        </div>
                    </template>
                </section>

                <!-- Dossier -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-2 text-sm font-bold text-navy-900">Dossier</h2>
                    <div class="flex flex-wrap gap-2">
                        <button type="button" @click="$store.os.go(data.project.path)" class="app-btn"><span x-icon="'folder'" class="h-4 w-4"></span> Projectdossier</button>
                        <button type="button" @click="$store.os.go(data.links.work_orders)" class="app-btn"><span x-icon="'wrench'" class="h-4 w-4"></span> Werkbonnen</button>
                    </div>
                    <p x-show="data?.delivered_text" class="mt-2 text-xs text-gray-500" x-text="data?.delivered_text"></p>
                </section>
            </div>
        </template>
    </div>
</template>
