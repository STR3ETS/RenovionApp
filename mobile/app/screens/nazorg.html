<!-- ===== Nazorg en service ===== -->
<template x-if="$store.os.route === 'nazorg'">
    <div x-data="service">
        <div data-enter class="app-ph">
            <p class="sec-eye"><span x-icon="'wrench'"></span> Projecten</p>
            <h1>Nazorg en <em>service</em></h1>
            <p class="sub">Meldingen na de oplevering. De eerste vraag is altijd of het onder garantie valt.</p>
            <div class="app-ph-acts">
                <button type="button" @click="add()" :disabled="!data" class="rounded-lg bg-brand-500 px-4 py-2 text-sm font-bold text-white active:bg-brand-600 disabled:opacity-60">
                    <span x-icon="'plus'" class="mr-1.5 h-4 w-4"></span>Melding aannemen
                </button>
            </div>
        </div>

        <section class="app-kpis mb-3" x-show="!failed">
            <div data-enter class="app-kpi dark">
                <span class="lbl">Open meldingen</span>
                <span class="v"><span x-text="data?.kpis.open"></span><span x-show="!data" class="skeleton skeleton-dark inline-block h-6 w-10 align-middle"></span></span>
                <span class="s">wachten op afhandeling</span>
            </div>
            <div data-enter class="app-kpi" style="--kc: #c2410c">
                <span class="lbl">Spoed</span>
                <span class="v" :class="data?.kpis.urgent > 0 && '!text-red-700'"><span x-text="data?.kpis.urgent"></span><span x-show="!data" class="skeleton inline-block h-6 w-10 align-middle"></span></span>
                <span class="s" x-text="data?.kpis.urgent_sub ?? ' '"></span>
            </div>
            <div data-enter class="app-kpi" style="--kc: #3e6ba8">
                <span class="lbl">Langst open</span>
                <span class="v"><span x-text="data?.kpis.oldest"></span><span x-show="!data" class="skeleton inline-block h-6 w-14 align-middle"></span></span>
                <span class="s">oudste melding</span>
            </div>
            <div data-enter class="app-kpi wide" style="--kc: #1e8a5a">
                <span class="lbl">Afgehandeld</span>
                <span class="v"><span x-text="data?.kpis.resolved"></span><span x-show="!data" class="skeleton inline-block h-6 w-10 align-middle"></span></span>
                <span class="s">in totaal</span>
            </div>
        </section>

        <div class="app-chips -mx-4 !flex-nowrap overflow-x-auto px-4 pb-1 [scrollbar-width:none]" x-show="data">
            <template x-for="option in data?.filters ?? []" :key="option.value">
                <button type="button" @click="filter(option.value)" class="app-chip shrink-0" :class="data.filter === option.value && 'on'" :aria-pressed="data.filter === option.value">
                    <b class="font-semibold" x-text="option.label"></b> <span x-text="option.count"></span>
                </button>
            </template>
        </div>

        <template x-if="failed">
            <div class="app-card p-5 text-center">
                <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                <button type="button" @click="load()" x-show="!$data.failGone" class="app-btn mt-3">Opnieuw proberen</button>
            </div>
        </template>

        <div class="space-y-3" x-show="!data && !failed">
            <template x-for="i in 3" :key="i">
                <div class="app-card p-4"><span class="skeleton mb-2 block h-4 w-2/3"></span><span class="skeleton mb-1.5 block h-3 w-full"></span><span class="skeleton block h-3 w-1/2"></span></div>
            </template>
        </div>

        <div x-show="data && !data.tickets.length" class="app-card p-6 text-center">
            <span class="mx-auto mb-2 flex h-11 w-11 items-center justify-center rounded-full bg-gray-100 text-gray-500"><span x-icon="'wrench'" class="h-5 w-5"></span></span>
            <p class="text-sm font-semibold text-navy-900">Geen servicemeldingen</p>
            <p class="mt-1 text-xs text-gray-500">Zodra een klant na de oplevering iets meldt, staat het hier.</p>
        </div>

        <div class="space-y-3">
            <template x-for="ticket in data?.tickets ?? []" :key="ticket.id">
                <div data-enter class="app-card p-4" :class="ticket.urgent && ticket.open && '!border-red-300'">
                    <div class="flex items-start gap-3">
                        <span class="app-ic" :class="ticket.urgent ? 'bad' : 'ok'"><span x-icon="'wrench'" class="h-5 w-5"></span></span>
                        <div class="min-w-0 flex-1">
                            <b class="block text-sm font-bold text-navy-900" x-text="ticket.title"></b>
                            <span class="mt-1 flex flex-wrap gap-1.5">
                                <span class="rounded-full px-2 py-0.5 text-[10px] font-bold" :class="ticket.status.classes" x-text="ticket.status.label"></span>
                                <span x-show="ticket.urgent" class="rounded-full bg-red-100 px-2 py-0.5 text-[10px] font-bold text-red-800">Spoed</span>
                                <span class="rounded-full px-2 py-0.5 text-[10px] font-bold" :class="ticket.warranty ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'" x-text="ticket.warranty ? 'Onder garantie' : 'Buiten garantie'"></span>
                            </span>
                            <p class="mt-1.5 text-sm whitespace-pre-line text-gray-700" x-text="ticket.description"></p>
                            <p class="mt-1.5 text-xs text-gray-500" x-text="ticket.meta"></p>
                            <p x-show="ticket.warranty_note" class="mt-1 text-xs" :class="ticket.warranty ? 'text-gray-500' : 'text-amber-700'" x-text="ticket.warranty_note"></p>
                            <p x-show="ticket.resolution" class="mt-2 rounded-lg bg-gray-50 p-3 text-xs text-gray-700" x-text="ticket.resolution"></p>
                        </div>
                    </div>

                    <template x-if="ticket.open">
                        <div class="mt-3 border-t border-gray-100 pt-3">
                            <button type="button" x-show="edit !== ticket.id" @click="open(ticket)" class="app-btn w-full justify-center"><span x-icon="'pencil'" class="h-4 w-4"></span> Bijwerken</button>
                            <form x-show="edit === ticket.id" @submit.prevent="update(ticket)" class="space-y-2">
                                <div class="grid grid-cols-2 gap-2">
                                    <label class="block"><span class="mb-1 block text-xs font-semibold text-gray-600">Status</span>
                                        <select x-model="editing.status" class="w-full">
                                            <template x-for="status in data.statuses" :key="status.value"><option :value="status.value" :selected="status.value === editing.status" x-text="status.label"></option></template>
                                        </select>
                                    </label>
                                    <label class="block"><span class="mb-1 block text-xs font-semibold text-gray-600">Gepland op</span>
                                        <input type="date" x-model="editing.planned_on" class="w-full">
                                    </label>
                                </div>
                                <label class="block"><span class="mb-1 block text-xs font-semibold text-gray-600">Toegewezen aan</span>
                                    <select x-model="editing.assigned_to" class="w-full">
                                        <option value="">Niemand toegewezen</option>
                                        <template x-for="person in data.people" :key="person.id"><option :value="String(person.id)" :selected="String(person.id) === editing.assigned_to" x-text="person.name"></option></template>
                                    </select>
                                </label>
                                <input type="text" x-model="editing.resolution" maxlength="5000" placeholder="Wat is er gedaan of afgesproken?" aria-label="Wat is er gedaan of afgesproken?" class="w-full">
                                <label class="flex min-h-11 items-center gap-2 text-sm text-gray-700">
                                    <input type="checkbox" x-model="editing.warranty" class="h-5 w-5 rounded border-gray-300 text-brand-500"> Garantie
                                </label>
                                <div class="flex gap-2">
                                    <button type="submit" :disabled="busy !== null" class="min-h-11 flex-1 rounded-xl bg-brand-500 text-sm font-bold text-white active:bg-brand-600 disabled:opacity-60" x-text="busy === 'update:' + ticket.id ? 'Bezig' : 'Opslaan'"></button>
                                    <button type="button" @click="edit = null" class="min-h-11 rounded-xl border border-gray-300 px-5 text-sm font-semibold text-gray-600">Annuleren</button>
                                </div>
                            </form>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Melding aannemen -->
        <div data-popup x-show="form" x-cloak @click.self="form = null" @renovion-back.window="if (form) { form = null; $event.preventDefault(); }"
             class="fixed inset-0 z-[60] flex items-end bg-navy-950/60 backdrop-blur-sm">
            <template x-if="form">
                <form @submit.prevent="save()" x-swipe-dismiss="form = null" class="max-h-[92dvh] w-full space-y-3 overflow-y-auto rounded-t-[20px] bg-white p-5 pb-[calc(1.25rem_+_env(safe-area-inset-bottom))]">
                    <div class="mx-auto -mt-2 mb-1 h-1.5 w-10 rounded-full bg-gray-300"></div>
                    <h2 class="text-base font-bold text-navy-900">Melding aannemen</h2>
                    <p class="text-xs text-gray-500">Het systeem rekent zelf uit of het nog binnen de garantietermijn valt.</p>
                    <label class="block"><span class="mb-1 block text-sm font-semibold text-gray-700">Project</span>
                        <select x-model="form.project_id" class="w-full">
                            <option value="">Geen project, alleen een klant</option>
                            <template x-for="project in data.projects" :key="project.id"><option :value="project.id" x-text="project.name"></option></template>
                        </select>
                    </label>
                    <label class="block" x-show="!form.project_id"><span class="mb-1 block text-sm font-semibold text-gray-700">Of een klant</span>
                        <select x-model="form.customer_id" class="w-full">
                            <option value="">Kies een klant</option>
                            <template x-for="customer in data.customers" :key="customer.id"><option :value="customer.id" x-text="customer.name"></option></template>
                        </select>
                    </label>
                    <label class="block"><span class="mb-1 block text-sm font-semibold text-gray-700">Wat is er aan de hand?</span>
                        <input type="text" x-model="form.title" required maxlength="200" class="w-full">
                    </label>
                    <label class="block"><span class="mb-1 block text-sm font-semibold text-gray-700">Toelichting</span>
                        <textarea x-model="form.description" rows="3" required maxlength="5000" class="w-full"></textarea>
                    </label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="block"><span class="mb-1 block text-sm font-semibold text-gray-700">Prioriteit</span>
                            <select x-model="form.priority" class="w-full">
                                <template x-for="priority in data.priorities" :key="priority.value"><option :value="priority.value" :selected="priority.value === form.priority" x-text="priority.label"></option></template>
                            </select>
                        </label>
                        <label class="block"><span class="mb-1 block text-sm font-semibold text-gray-700">Binnengekomen via</span>
                            <select x-model="form.reported_via" class="w-full">
                                <template x-for="channel in data.channels" :key="channel.value"><option :value="channel.value" :selected="channel.value === form.reported_via" x-text="channel.label"></option></template>
                            </select>
                        </label>
                    </div>
                    <div class="flex gap-2 pt-1">
                        <button type="submit" :disabled="busy !== null" class="min-h-11 flex-1 rounded-xl bg-brand-500 text-sm font-bold text-white active:bg-brand-600 disabled:opacity-60" x-text="busy === 'store' ? 'Bezig' : 'Aannemen'"></button>
                        <button type="button" @click="form = null" class="min-h-11 rounded-xl border border-gray-300 px-5 text-sm font-semibold text-gray-600">Annuleren</button>
                    </div>
                </form>
            </template>
        </div>
    </div>
</template>
