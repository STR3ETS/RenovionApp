<!-- ===== Documenten (documents/index, alleen kantoor) ===== -->
<template x-if="$store.os.route === 'documenten'">
    <div x-data="documents">
        <div data-enter class="app-ph">
            <p class="sec-eye"><span x-icon="'folder'"></span> Organisatie</p>
            <h1><em>Documenten</em></h1>
            <p class="sub">Alles wat er aan papier omgaat, in vier logische groepen in plaats van twaalf losse mappen.</p>
        </div>

        <div class="mb-3 space-y-2">
            <div class="relative">
                <span x-icon="'magnifying-glass'" class="pointer-events-none absolute top-1/2 left-3.5 h-4 w-4 -translate-y-1/2 text-gray-400"></span>
                <input type="search" x-model="q" @input="search()" @keydown.enter="apply(); $el.blur()" enterkeyhint="search" placeholder="Zoek op bestandsnaam" aria-label="Documenten zoeken" class="w-full !rounded-xl !pl-10">
            </div>
            <select x-model="categorie" @change="apply()" aria-label="Categorie" class="w-full !rounded-xl">
                <option value="">Alle categorieën</option>
                <template x-for="option in data?.categories ?? []" :key="option.value">
                    <option :value="option.value" :selected="option.value === categorie" x-text="option.label + ' (' + option.count + ')'"></option>
                </template>
            </select>
        </div>

        <!-- Groepen (zoals de tabs op de website) -->
        <div class="-mx-4 mb-4 flex gap-1 overflow-x-auto px-4 pb-1 [scrollbar-width:none]">
            <button type="button" @click="setGroup('')" class="tap shrink-0 rounded-full px-3.5 py-[7px] text-[13.5px] font-semibold" :class="groep === '' && categorie === '' ? 'bg-navy-900 text-white' : 'text-gray-600'">
                Alles <span class="ml-0.5 opacity-70" x-text="data?.all ?? ''"></span>
            </button>
            <template x-for="option in data?.groups ?? []" :key="option.value">
                <button type="button" @click="setGroup(option.value)" class="tap shrink-0 rounded-full px-3.5 py-[7px] text-[13.5px] font-semibold whitespace-nowrap" :class="groep === option.value ? 'bg-navy-900 text-white' : 'text-gray-600'">
                    <span x-text="option.label"></span> <span class="ml-0.5 opacity-70" x-text="option.count"></span>
                </button>
            </template>
        </div>

        <template x-if="failed">
            <div class="app-card p-5 text-center">
                <p class="text-sm font-semibold text-navy-900">Geen verbinding met de server</p>
                <button type="button" @click="load()" class="app-btn mt-3">Opnieuw proberen</button>
            </div>
        </template>

        <template x-if="data && list.length === 0">
            <div class="app-card p-6 text-center">
                <span class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-klant-100 text-klant-700"><span x-icon="'folder'" class="h-6 w-6"></span></span>
                <p class="text-sm font-bold text-navy-900">Geen documenten gevonden</p>
                <p class="mt-1 text-sm text-gray-500">Documenten komen hier terecht zodra ze bij een klant, project of offerte worden geüpload.</p>
            </div>
        </template>

        <div data-enter class="app-card" x-show="!failed && (!data || list.length > 0)">
            <div class="app-card-b">
                <template x-for="i in (data ? 0 : 6)" :key="i">
                    <div class="flex items-center gap-3.5 py-3.5"><span class="skeleton h-10 w-10 shrink-0 !rounded-xl"></span><span class="flex-1"><span class="skeleton mb-2 block h-3.5 w-2/3"></span><span class="skeleton block h-3 w-1/2"></span></span></div>
                </template>
                <template x-for="document in list" :key="document.id">
                    <a :href="'#/document/' + document.id" class="app-li !items-center">
                        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-klant-100 text-klant-700"><span x-icon="document.icon" class="h-5 w-5"></span></span>
                        <span class="min-w-0 flex-1">
                            <b class="truncate" x-text="document.name"></b>
                            <small class="truncate" x-text="document.sub"></small>
                        </span>
                        <span class="shrink-0 text-right text-xs text-gray-500" x-text="document.size ?? ''"></span>
                        <span x-icon="'chevron-right'" class="h-4 w-4 shrink-0 text-gray-300"></span>
                    </a>
                </template>
            </div>
        </div>

        <button type="button" x-show="data && hasMore" @click="loadMore()" :disabled="loadingMore" class="app-btn mt-3 w-full justify-center disabled:opacity-60" x-text="loadingMore ? 'Bezig' : 'Meer documenten'"></button>
    </div>
</template>

<!-- ===== Document (documents.show) ===== -->
<template x-if="$store.os.route === 'document'">
    <div>
        <template x-for="id in [$store.os.param]" :key="id">
            <div x-data="documentFile(id)" class="pb-4">
                <nav class="app-crumbs mb-2 !text-gray-500">
                    <template x-if="data?.project">
                        <span class="contents">
                            <button type="button" @click="$store.os.go(data.project.path)" class="tap inline-flex min-w-0 items-center gap-1 font-semibold !text-brand-700"><span x-icon="'folder'" class="h-3.5 w-3.5 shrink-0"></span><span class="truncate" x-text="data.project.name"></span></button>
                            <span x-icon="'chevron-right'" class="h-3 w-3 shrink-0"></span>
                        </span>
                    </template>
                    <a x-show="$store.os.crm && !data?.project" href="#/documenten" class="tap">Documenten</a>
                    <button type="button" x-show="!$store.os.crm && !data?.project" @click="back()" class="tap">Terug</button>
                    <span x-show="!data?.project" x-icon="'chevron-right'" class="h-3 w-3"></span>
                    <span class="truncate" x-text="data?.category ?? ''"></span>
                </nav>
                <div data-enter class="app-ph">
                    <p class="sec-eye"><span x-icon="data?.icon ?? 'paper-clip'"></span> Document</p>
                    <h1 class="break-words"><span x-text="data?.name ?? ''"></span><span x-show="!data" class="skeleton inline-block h-7 w-2/3 align-middle"></span></h1>
                    <p class="sub" x-text="data ? [data.category, data.size].filter(Boolean).join(', ') : ''"></p>
                </div>

                <template x-if="failed">
                    <div class="app-card mb-3 p-5 text-center">
                        <p class="text-sm font-semibold text-navy-900">Geen verbinding met de server</p>
                        <button type="button" @click="load()" class="app-btn mt-3">Opnieuw proberen</button>
                    </div>
                </template>

                <!-- Foto: meteen in beeld, tik = schermvullend -->
                <template x-if="data?.kind === 'image'">
                    <button type="button" data-enter @click="viewer = true" class="mb-3 block w-full overflow-hidden rounded-2xl border border-gray-200 bg-gray-100" aria-label="Foto schermvullend bekijken">
                        <img :src="fileUrl(data)" :alt="data.name" class="max-h-[60vh] w-full object-contain">
                    </button>
                </template>
                <template x-if="data && data.kind !== 'image'">
                    <div data-enter class="app-card mb-3 flex flex-col items-center gap-2 p-6 text-center">
                        <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-klant-100 text-klant-700"><span x-icon="data.icon" class="h-7 w-7"></span></span>
                        <p class="text-sm font-semibold text-navy-900" x-text="data.kind === 'pdf' ? 'PDF-document' : 'Bestand'"></p>
                        <p class="text-xs text-gray-500" x-text="data.mime ?? ''"></p>
                    </div>
                </template>
                <template x-if="!data && !failed">
                    <div class="app-card mb-3 p-6"><span class="skeleton mx-auto block h-14 w-14 !rounded-2xl"></span><span class="skeleton mx-auto mt-3 block h-3.5 w-1/3"></span></div>
                </template>

                <div class="mb-3 grid grid-cols-2 gap-2" x-show="data">
                    <button type="button" @click="data.kind === 'image' ? (viewer = true) : open()" class="app-btn pri min-h-11 justify-center"><span x-icon="'eye'" class="h-4 w-4"></span> Openen</button>
                    <button type="button" @click="open(true)" class="app-btn min-h-11 justify-center"><span x-icon="'arrow-down-tray'" class="h-4 w-4"></span> Downloaden</button>
                </div>

                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-2 text-sm font-bold text-navy-900">Gegevens</h2>
                    <div class="app-fields !mt-0">
                        <div><span class="app-lbl">Categorie</span><b x-text="data?.category"></b></div>
                        <div><span class="app-lbl">Groep</span><b x-text="data?.group"></b></div>
                        <div><span class="app-lbl">Geüpload</span><b x-text="data?.uploaded"></b></div>
                        <div x-show="data?.size"><span class="app-lbl">Grootte</span><b x-text="data?.size"></b></div>
                    </div>
                    <div class="mt-3 flex flex-wrap gap-2" x-show="data?.customer || data?.belongs_to">
                        <button type="button" x-show="data?.customer" @click="$store.os.go(data.customer.path)" class="app-btn min-h-11"><span x-icon="'users'" class="h-4 w-4"></span> <span x-text="data?.customer?.name"></span></button>
                        <button type="button" x-show="data?.belongs_to" @click="$store.os.go(data.belongs_to.path)" class="app-btn min-h-11"><span x-icon="'folder'" class="h-4 w-4"></span> <span x-text="data?.belongs_to ? data.belongs_to.label + ': ' + data.belongs_to.name : ''"></span></button>
                    </div>
                </section>

                <!-- Foto schermvullend -->
                <div x-show="viewer" x-cloak data-popup @renovion-back.window="if (viewer) { viewer = false; $event.preventDefault(); }" class="fixed inset-0 z-[70] flex flex-col bg-black pt-safe pb-safe">
                    <template x-if="viewer && data">
                        <div class="flex h-full flex-col">
                            <div class="flex items-center gap-3 px-4 py-3 text-white">
                                <span class="min-w-0 flex-1 truncate text-sm font-semibold" x-text="data.name"></span>
                                <button type="button" @click="viewer = false" class="tap rounded-lg p-2 text-white" aria-label="Sluiten"><span x-icon="'x-mark'" class="h-6 w-6"></span></button>
                            </div>
                            <div class="flex min-h-0 flex-1 items-center justify-center" @click.self="viewer = false">
                                <img :src="fileUrl(data)" :alt="data.name" class="max-h-full max-w-full object-contain">
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</template>
