<template x-if="$store.os.route === 'offerte'">
    <div>
        <template x-for="id in [$store.os.param]" :key="id">
            <div x-data="quote(id)">
                <nav class="app-crumbs mb-2 !text-gray-500">
                    <template x-if="data?.project">
                        <span class="contents">
                            <button type="button" @click="$store.os.go(data.project.path)" class="tap inline-flex min-w-0 items-center gap-1 font-semibold !text-brand-700"><span x-icon="'folder'" class="h-3.5 w-3.5 shrink-0"></span><span class="truncate" x-text="data.project.name"></span></button>
                            <span x-icon="'chevron-right'" class="h-3 w-3 shrink-0"></span>
                        </span>
                    </template>
                    <button type="button" x-show="!data?.project" @click="data && $store.os.go(data.customer.path)" class="tap" x-text="data?.customer.name ?? 'Klant'"></button>
                    <span x-show="!data?.project" x-icon="'chevron-right'" class="h-3 w-3"></span>
                    <span x-text="data?.number ?? ''"></span>
                </nav>
                <div data-enter class="app-ph">
                    <p class="sec-eye"><span x-icon="'document-text'"></span> Offerte</p>
                    <h1><span x-text="data ? data.number + ', v' + data.version : ''"></span><span x-show="!data" class="skeleton inline-block h-7 w-2/3 align-middle"></span></h1>
                    <p class="sub" x-text="data ? [data.title, data.subtitle].filter(Boolean).join(' · ') : ''"></p>
                    <div class="app-ph-acts" x-show="data">
                        <span class="rounded-full px-3 py-1 text-sm font-semibold" :class="data?.status.classes" x-text="data?.status.label"></span>
                    </div>
                </div>

                <template x-if="failed">
                    <div class="app-card p-5 text-center">
                        <p class="text-sm font-semibold text-navy-900">Geen verbinding met de server</p>
                        <button type="button" @click="load()" class="app-btn mt-3">Opnieuw proberen</button>
                    </div>
                </template>

                <div x-show="data?.signals.length" class="mb-3 space-y-1.5 rounded-2xl border border-amber-200 bg-amber-50 p-4">
                    <template x-for="signal in data?.signals ?? []" :key="signal.text">
                        <p class="flex items-start gap-2 text-sm font-medium text-amber-900">
                            <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full" :class="{ red: 'bg-red-500', amber: 'bg-amber-500' }[signal.color]"></span>
                            <span class="whitespace-pre-line" x-text="signal.text"></span>
                        </p>
                    </template>
                </div>

                <div class="mb-3 grid grid-cols-2 gap-2" x-show="data">
                    <button type="button" @click="$store.os.go(data.links.document)" class="app-btn pri col-span-2 justify-center"><span x-icon="'document-text'" class="h-4 w-4"></span> Offerte bekijken en PDF</button>
                    <a x-show="data?.customer.phone" :href="'tel:' + data?.customer.phone" class="app-btn justify-center"><span x-icon="'phone'" class="h-4 w-4"></span> Bellen</a>
                    <a x-show="data?.mail" :href="data?.mail" class="app-btn justify-center"><span x-icon="'envelope'" class="h-4 w-4"></span> Mailen</a>
                    <button type="button" x-show="data?.links.builder" @click="$store.os.openWeb(data.links.builder)" class="app-btn justify-center"><span x-icon="'sparkles'" class="h-4 w-4"></span> Offerte bouwen</button>
                    <button type="button" x-show="data?.links.edit" @click="$store.os.go(data.links.edit)" class="app-btn justify-center"><span x-icon="'pencil'" class="h-4 w-4"></span> Posten bewerken</button>
                    <button type="button" x-show="data?.links.project" @click="$store.os.go(data.links.project)" class="app-btn justify-center"><span x-icon="'folder'" class="h-4 w-4"></span> Naar project</button>
                </div>

                <!-- Klantlink -->
                <section data-enter class="app-card mb-3 p-4" x-show="data?.public_url">
                    <h2 class="mb-1 text-sm font-bold text-navy-900">Klantlink</h2>
                    <p class="mb-3 text-xs text-gray-500">Via deze privélink bekijkt en ondertekent de klant de offerte. Elke keer dat de klant kijkt, zie je dat hier terug.</p>
                    <div class="flex items-center gap-2">
                        <span class="min-w-0 flex-1 truncate rounded-xl border border-gray-200 bg-gray-50 px-3 py-2.5 text-xs text-gray-600" x-text="data?.public_url"></span>
                        <button type="button" @click="copyLink()" class="app-btn shrink-0" x-text="copied ? 'Gekopieerd' : 'Kopiëren'"></button>
                    </div>
                </section>

                <!-- Status -->
                <section data-enter class="app-card mb-3 p-4" x-show="data?.actions.length">
                    <h2 class="mb-3 text-sm font-bold text-navy-900">Status</h2>
                    <div class="space-y-2">
                        <template x-for="action in data?.actions ?? []" :key="action.value">
                            <button type="button" @click="setStatus(action)" :disabled="busy !== null"
                                    class="tap flex w-full items-center justify-center gap-1.5 rounded-xl py-2.5 text-sm font-bold disabled:opacity-60"
                                    :class="{ verstuurd: 'bg-brand-500 text-white active:bg-brand-600', opvolgen: 'border border-gray-200 bg-white text-navy-900', akkoord: 'bg-green-600 text-white', afgewezen: 'border border-red-200 bg-white text-red-600' }[action.value]">
                                <span x-icon="{ verstuurd: 'paper-airplane', opvolgen: 'bell', akkoord: 'check', afgewezen: 'x-mark' }[action.value]" class="h-4 w-4"></span>
                                <span x-text="busy === action.value ? 'Bezig' : action.label"></span>
                            </button>
                        </template>
                    </div>
                    <p x-show="data?.concept" class="mt-2 text-xs text-gray-500">Versturen bevriest deze versie en zet de klantlink aan. Daarna deel je de link met de klant.</p>
                </section>

                <section data-enter class="mb-3 rounded-2xl border border-green-200 bg-green-50 p-4" x-show="data?.signed">
                    <h2 class="flex items-center gap-1.5 text-sm font-bold text-green-800"><span x-icon="'check'" class="h-4 w-4"></span> Digitaal ondertekend</h2>
                    <p class="mt-1 text-sm font-semibold text-green-800" x-text="data?.signed?.name"></p>
                    <p class="text-xs text-green-700" x-text="data?.signed?.sub"></p>
                </section>

                <!-- Investering -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-1 text-sm font-bold text-navy-900">Investering</h2>
                    <p x-show="data && data.lines.length === 0" class="py-2 text-sm text-gray-500">Nog geen posten.</p>
                    <ul class="divide-y divide-gray-100">
                        <template x-for="line in data?.lines ?? []" :key="line.id">
                            <li class="flex items-start gap-3 py-2.5">
                                <span class="min-w-0 flex-1">
                                    <span class="block text-sm font-medium text-navy-900" x-text="line.description"></span>
                                    <span class="text-xs text-gray-500" x-text="line.quantity"></span>
                                    <span x-show="line.estimate" class="ml-1 rounded-full bg-amber-100 px-2 py-0.5 text-[10px] font-semibold text-amber-800">stelpost</span>
                                </span>
                                <span class="shrink-0 text-sm font-semibold whitespace-nowrap text-navy-900" x-text="osFormat.euro(line.total, 2)"></span>
                            </li>
                        </template>
                    </ul>
                    <dl class="mt-2 space-y-1 border-t border-gray-200 pt-2 text-sm">
                        <div class="flex justify-between"><dt class="text-gray-500">Subtotaal</dt><dd class="font-semibold text-navy-900" x-text="osFormat.euro(data?.subtotal, 2)"></dd></div>
                        <div class="flex justify-between"><dt class="text-gray-500">Btw</dt><dd class="font-semibold text-navy-900" x-text="osFormat.euro(data?.vat, 2)"></dd></div>
                        <div class="flex justify-between text-base"><dt class="font-bold text-navy-900">Totaal</dt><dd class="font-bold text-navy-900" x-text="osFormat.euro(data?.total, 2)"></dd></div>
                    </dl>
                </section>

                <!-- Versies -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-2 text-sm font-bold text-navy-900">Versies</h2>
                    <div class="space-y-2">
                        <div class="flex items-center gap-3 rounded-xl border border-brand-200 bg-brand-50 p-2.5 text-sm">
                            <b class="text-navy-900" x-text="'v' + data?.version"></b>
                            <span class="flex-1 text-gray-600" x-text="'Huidige versie, ' + (data?.status.label ?? '').toLowerCase()"></span>
                        </div>
                        <template x-for="version in data?.versions ?? []" :key="version.version">
                            <div class="flex items-center gap-3 rounded-xl border border-gray-200 p-2.5 text-sm">
                                <b class="text-gray-500" x-text="'v' + version.version"></b>
                                <span class="min-w-0 flex-1">
                                    <span class="block truncate text-gray-700" x-text="version.note"></span>
                                    <span class="text-xs text-gray-500" x-text="version.sub"></span>
                                </span>
                                <span class="text-xs font-semibold whitespace-nowrap text-gray-500" x-text="osFormat.euro(version.total)"></span>
                            </div>
                        </template>
                        <p x-show="data && data.versions.length === 0" class="text-xs text-gray-500" x-text="'Nog geen eerdere versies. Bij versturen wordt de inhoud bevroren als v' + data?.version + '.'"></p>
                    </div>
                    <form x-show="data && !data.concept" @submit.prevent="newVersion()" class="mt-3 space-y-2">
                        <input type="text" x-model="versionNote" required maxlength="255" placeholder="Wat wijzigt er in deze versie?" class="w-full">
                        <button type="submit" :disabled="busy !== null || !versionNote.trim()" class="app-btn w-full justify-center disabled:opacity-60" x-text="busy === 'version' ? 'Bezig' : 'Nieuwe versie starten'"></button>
                    </form>
                </section>

                <!-- Verloop -->
                <section data-enter class="app-card mb-3 p-4" x-show="data">
                    <h2 class="mb-2 text-sm font-bold text-navy-900">Verloop</h2>
                    <div class="app-fields !mt-0">
                        <template x-for="row in data?.history ?? []" :key="row.label">
                            <div><span class="app-lbl" x-text="row.label"></span><b :class="row.late && 'text-red-600'" x-text="row.value"></b></div>
                        </template>
                    </div>
                    <div class="mt-3 flex flex-wrap gap-2">
                        <button type="button" @click="$store.os.go(data.customer.path)" class="app-btn"><span x-icon="'folder'" class="h-4 w-4"></span> Klantdossier</button>
                        <button type="button" x-show="data?.links.lead" @click="$store.os.go(data.links.lead)" class="app-btn"><span x-icon="'funnel'" class="h-4 w-4"></span> Aanvraag</button>
                        <button type="button" x-show="data?.links.calculation" @click="$store.os.go(data.links.calculation.path)" class="app-btn"><span x-icon="'calculator'" class="h-4 w-4"></span> Calculatie</button>
                    </div>
                </section>

                <section data-enter class="app-card mb-3 p-4" x-show="data?.notes">
                    <h2 class="mb-1 text-sm font-bold text-navy-900">Opmerkingen (intern)</h2>
                    <p class="text-sm whitespace-pre-line text-gray-700" x-text="data?.notes"></p>
                </section>
            </div>
        </template>
    </div>
</template>
