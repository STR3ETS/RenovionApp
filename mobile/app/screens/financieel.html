<!-- ===== Financieel ===== -->
<template x-if="$store.os.route === 'financieel'">
    <div x-data="finance">
        <nav class="app-sectabs" aria-label="Onderdelen van Geld">
            <a href="#/financieel" class="on" aria-current="page">Financieel</a>
            <a href="#/facturen">Facturatie</a>
            <a href="#/inkoop">Inkoop</a>
            <a href="#/nacalculatie">Nacalculatie</a>
        </nav>

        <div data-enter class="app-ph">
            <p class="sec-eye"><span x-icon="'banknotes'"></span> Geld</p>
            <h1><em>Financieel</em></h1>
            <p class="sub">Omzet, werkvoorraad, debiteuren en crediteuren, met een prognose voor zes maanden.</p>
        </div>

        <template x-if="failed">
            <div class="app-card mb-3 p-5 text-center">
                <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                <button type="button" x-show="!$data.failGone" @click="load()" class="app-btn mt-3 min-h-11">Opnieuw proberen</button>
            </div>
        </template>

        <section class="app-kpis mb-3" x-show="!failed">
            <div data-enter class="app-kpi dark">
                <span class="lbl">Werkvoorraad</span>
                <span class="v"><i>€</i> <span x-text="data ? osFormat.euro(data.kpis.order_book).slice(2) : ''"></span><span x-show="!data" class="skeleton skeleton-dark inline-block h-6 w-32 align-middle"></span></span>
                <span class="s" x-text="data ? osFormat.euro(data.kpis.revenue_year) + ' omzet dit jaar' : ' '"></span>
            </div>
            <template x-for="kpi in [
                { label: 'Nog te factureren', key: 'uninvoiced', sub: () => 'uit termijnen', color: '#1e8a5a' },
                { label: 'Debiteuren', key: 'debtors', late: 'debtors_overdue', color: '#3e6ba8' },
                { label: 'Crediteuren', key: 'creditors', late: 'creditors_overdue', color: '#7c5cd6' },
                { label: 'Verplichtingen', key: 'commitments', sub: () => 'besteld, nog geen factuur', color: '#d98a0b' },
                { label: 'Pipeline gewogen', key: 'pipeline', sub: () => osFormat.euro(data.kpis.open_quotes) + ' aan offertes', color: '#c2506d', wide: true },
            ]" :key="kpi.key">
                <div data-enter class="app-kpi" :class="kpi.wide && 'wide'" :style="`--kc: ${kpi.late && data?.kpis[kpi.late] > 0 ? '#e5484d' : kpi.color}`">
                    <span class="lbl" x-text="kpi.label"></span>
                    <span class="v !text-[22px]"><span x-text="data ? osFormat.euro(data.kpis[kpi.key]) : ''"></span><span x-show="!data" class="skeleton inline-block h-6 w-20 align-middle"></span></span>
                    <span class="s" :class="kpi.late && data?.kpis[kpi.late] > 0 && 'font-semibold !text-red-600'"
                          x-text="!data ? ' ' : kpi.late ? (data.kpis[kpi.late] > 0 ? osFormat.euro(data.kpis[kpi.late]) + ' te laat' : 'niets te laat') : kpi.sub()"></span>
                </div>
            </template>
        </section>

        <!-- Omzet per maand -->
        <section data-enter class="app-card mb-3 p-4" x-show="!failed">
            <h2 class="mb-3 text-sm font-bold text-navy-900">Omzet <span class="text-brand-600">per maand</span></h2>
            <div class="flex h-36 items-end gap-2">
                <template x-for="i in (data ? 0 : 6)" :key="i"><span class="skeleton block flex-1 !rounded-b-none" :style="`height: ${20 + i * 10}%`"></span></template>
                <template x-for="month in data?.revenue ?? []" :key="month.month">
                    <div class="flex h-full min-w-0 flex-1 flex-col items-center justify-end gap-1">
                        <span class="text-[10px] font-semibold text-gray-500" x-text="month.amount > 0 ? thousands(month.amount) : ''"></span>
                        <span class="block w-full rounded-t bg-brand-500/80" :style="bar(month.amount, maxRevenue)"></span>
                        <span class="text-[10px] text-gray-500" x-text="month.label"></span>
                    </div>
                </template>
            </div>
        </section>

        <!-- Cashflow -->
        <section data-enter class="app-card mb-3 p-4" x-show="!failed">
            <h2 class="text-sm font-bold text-navy-900">Cashflow <span class="text-brand-600">zes maanden</span></h2>
            <p class="mb-3 text-xs text-gray-500">Een prognose, geen boekhouding. Inkomsten op vervaldatum, uitgaven op leverdatum.</p>
            <div class="flex h-36 items-end gap-2.5">
                <template x-for="i in (data ? 0 : 6)" :key="i"><span class="skeleton block flex-1 !rounded-b-none" :style="`height: ${70 - i * 8}%`"></span></template>
                <template x-for="month in data?.cashflow ?? []" :key="month.month">
                    <div class="flex h-full min-w-0 flex-1 flex-col items-center justify-end gap-1">
                        <span class="flex w-full flex-1 items-end gap-0.5">
                            <span class="block flex-1 rounded-t bg-green-500/80" :style="bar(month.in, maxCash)" :aria-label="'In ' + osFormat.euro(month.in)"></span>
                            <span class="block flex-1 rounded-t bg-red-500/70" :style="bar(month.out, maxCash)" :aria-label="'Uit ' + osFormat.euro(month.out)"></span>
                        </span>
                        <span class="text-[10px] font-semibold" :class="month.net < 0 ? 'text-red-600' : 'text-gray-500'" x-text="(month.net >= 0 ? '+' : '') + thousands(month.net)"></span>
                        <span class="text-[10px] text-gray-500" x-text="month.label"></span>
                    </div>
                </template>
            </div>
            <div class="mt-3 flex gap-4 border-t border-gray-100 pt-3 text-xs text-gray-500">
                <span class="flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-green-500/80"></span> Binnen</span>
                <span class="flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-red-500/70"></span> Uit</span>
            </div>
        </section>

        <!-- Debiteuren -->
        <section data-enter class="app-card mb-3" x-show="!failed">
            <div class="app-card-h">
                <h3>Debiteuren</h3>
                <a href="#/facturen" class="app-btn ghost">Facturatie</a>
            </div>
            <div class="app-card-b">
                <template x-for="i in (data ? 0 : 3)" :key="i"><div class="py-3"><span class="skeleton mb-2 block h-3.5 w-2/3"></span><span class="skeleton block h-3 w-1/3"></span></div></template>
                <p x-show="data && data.debtors.length === 0" class="py-3 text-sm text-gray-500">Geen openstaande facturen.</p>
                <template x-for="row in data?.debtors ?? []" :key="row.id">
                    <button type="button" @click="$store.os.go(row.path)" class="app-li ibx w-full text-left" :style="`--st: ${row.overdue ? '#e5484d' : '#c9d1dd'}`">
                        <span class="min-w-0 flex-1">
                            <b class="truncate" x-text="row.title"></b>
                            <small :class="row.overdue && '!text-red-600'" x-text="row.sub"></small>
                        </span>
                        <b class="shrink-0 whitespace-nowrap" x-text="osFormat.euro(row.amount)"></b>
                    </button>
                </template>
            </div>
        </section>

        <!-- Crediteuren -->
        <section data-enter class="app-card mb-3" x-show="!failed">
            <div class="app-card-h">
                <h3>Crediteuren</h3>
                <a href="#/inkoop" class="app-btn ghost">Inkoop</a>
            </div>
            <div class="app-card-b">
                <p class="pt-3 text-xs text-gray-500" x-show="data" x-text="data ? 'Plus ' + osFormat.euro(data.kpis.commitments) + ' aan bestellingen waarvan de factuur nog moet komen.' : ''"></p>
                <template x-for="i in (data ? 0 : 3)" :key="i"><div class="py-3"><span class="skeleton mb-2 block h-3.5 w-2/3"></span><span class="skeleton block h-3 w-1/3"></span></div></template>
                <p x-show="data && data.creditors.length === 0" class="py-3 text-sm text-gray-500">Geen openstaande inkoopfacturen.</p>
                <template x-for="row in data?.creditors ?? []" :key="row.id">
                    <div class="app-li ibx" :style="`--st: ${row.overdue ? '#e5484d' : '#c9d1dd'}`">
                        <span class="min-w-0 flex-1">
                            <b class="truncate" x-text="row.title"></b>
                            <small :class="row.overdue && '!text-red-600'" x-text="row.sub"></small>
                        </span>
                        <b class="shrink-0 whitespace-nowrap" x-text="osFormat.euro(row.amount)"></b>
                    </div>
                </template>
            </div>
        </section>
    </div>
</template>

<!-- ===== Nacalculatie ===== -->
<template x-if="$store.os.route === 'nacalculatie'">
    <div x-data="costReviews">
        <nav class="app-sectabs" aria-label="Onderdelen van Geld">
            <a href="#/financieel">Financieel</a>
            <a href="#/facturen">Facturatie</a>
            <a href="#/inkoop">Inkoop</a>
            <a href="#/nacalculatie" class="on" aria-current="page">Nacalculatie</a>
        </nav>

        <div data-enter class="app-ph">
            <p class="sec-eye"><span x-icon="'calculator'"></span> Geld</p>
            <h1><em>Nacalculatie</em></h1>
            <p class="sub">Begroot tegenover werkelijk en verwacht. Werkelijk komt uit goedgekeurde werkbonnen en inkoopfacturen.</p>
        </div>

        <template x-if="failed">
            <div class="app-card mb-3 p-5 text-center">
                <p class="text-sm font-semibold text-navy-900" x-text="$data.failText ?? 'Geen verbinding met de server'">Geen verbinding met de server</p>
                <button type="button" x-show="!$data.failGone" @click="load()" class="app-btn mt-3 min-h-11">Opnieuw proberen</button>
            </div>
        </template>

        <!-- Leerpunten -->
        <section data-enter class="mb-3 rounded-2xl border border-amber-200 bg-amber-50 p-4" x-show="data?.lessons.length">
            <h2 class="text-sm font-bold text-navy-900">Leer<span class="text-brand-600">punten</span></h2>
            <p class="mb-3 text-xs text-gray-600">Over projecten heen: waar de geboekte uren structureel afwijken van de begrote. Alleen rollen met minstens twee werkbonnen en een afwijking van acht procent of meer.</p>
            <div class="space-y-2">
                <template x-for="lesson in data?.lessons ?? []" :key="lesson.role">
                    <div class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white p-3">
                        <span class="min-w-0 flex-1">
                            <b class="block text-sm font-semibold text-navy-900" x-text="lesson.role"></b>
                            <small class="block text-xs text-gray-500" x-text="lesson.sub"></small>
                        </span>
                        <span class="shrink-0 rounded-full px-2.5 py-1 text-xs font-bold" :class="lesson.classes" x-text="lesson.variance"></span>
                    </div>
                </template>
            </div>
        </section>

        <template x-if="data && data.projects.length === 0">
            <div class="app-card p-6 text-center">
                <span class="mx-auto mb-2 flex h-10 w-10 items-center justify-center rounded-full bg-gray-100 text-gray-500"><span x-icon="'calculator'" class="h-5 w-5"></span></span>
                <p class="text-sm font-semibold text-navy-900">Nog geen nacalculatie mogelijk</p>
                <p class="mt-0.5 text-xs text-gray-500">Een project heeft een begroting nodig om tegen af te zetten.</p>
            </div>
        </template>

        <div class="space-y-3">
            <template x-for="i in (!data && !failed ? 3 : 0)" :key="i">
                <div class="app-card p-4"><span class="skeleton mb-2 block h-4 w-2/3"></span><span class="skeleton mb-3 block h-3 w-full"></span><span class="grid grid-cols-3 gap-2"><span class="skeleton block h-8"></span><span class="skeleton block h-8"></span><span class="skeleton block h-8"></span></span></div>
            </template>
            <template x-for="project in data?.projects ?? []" :key="project.id">
                <section data-enter class="app-card">
                    <button type="button" @click="toggle(project.id)" class="block w-full p-4 text-left" :aria-expanded="open === project.id">
                        <span class="flex items-start gap-2">
                            <span class="min-w-0 flex-1">
                                <b class="block text-[15px] font-bold text-navy-900" x-text="project.name"></b>
                                <small class="mt-0.5 block text-xs text-gray-500" x-text="project.sub"></small>
                            </span>
                            <span class="shrink-0 rounded-full px-2.5 py-1 text-xs font-bold" :class="project.classes" x-text="project.variance"></span>
                        </span>
                        <span class="mt-3 grid grid-cols-3 gap-2 text-center">
                            <template x-for="[label, key] in [['Begroot', 'budgeted'], ['Werkelijk', 'actual'], ['Verwacht', 'expected']]" :key="key">
                                <span class="rounded-xl bg-gray-50 px-1 py-2">
                                    <span class="block text-[10px] font-bold tracking-wider text-gray-500 uppercase" x-text="label"></span>
                                    <span class="block text-sm font-bold text-navy-900" :class="key === 'budgeted' && '!text-gray-600'" x-text="osFormat.euro(project[key])"></span>
                                </span>
                            </template>
                        </span>
                        <span class="mt-2 flex items-center justify-center gap-1 text-xs font-semibold text-gray-500">
                            <span x-text="open === project.id ? 'Minder' : 'Per kostensoort'"></span>
                            <span x-icon="'chevron-down'" class="h-3.5 w-3.5 transition-transform" :class="open === project.id && 'rotate-180'"></span>
                        </span>
                    </button>

                    <div x-show="open === project.id" x-cloak class="border-t border-gray-100 bg-gray-50 p-4">
                        <div class="space-y-2">
                            <template x-for="row in project.rows" :key="row.name">
                                <div class="rounded-xl border border-gray-200 bg-white p-3">
                                    <div class="flex items-center justify-between gap-2">
                                        <b class="text-sm font-semibold text-navy-900" x-text="row.name"></b>
                                        <span class="rounded-full px-2 py-0.5 text-xs font-bold" :class="row.classes" x-text="row.variance"></span>
                                    </div>
                                    <dl class="mt-2 grid grid-cols-3 gap-2 text-xs">
                                        <div><dt class="text-gray-500">Begroot</dt><dd class="font-semibold text-gray-600" x-text="osFormat.euro(row.budgeted)"></dd></div>
                                        <div><dt class="text-gray-500">Werkelijk</dt><dd class="font-semibold text-navy-900" x-text="osFormat.euro(row.actual)"></dd></div>
                                        <div><dt class="text-gray-500">Verwacht</dt><dd class="font-bold text-navy-900" x-text="osFormat.euro(row.expected)"></dd></div>
                                    </dl>
                                    <p class="mt-1.5 text-xs text-gray-500" x-text="row.note"></p>
                                </div>
                            </template>
                        </div>
                        <div class="mt-3 grid grid-cols-2 gap-2">
                            <div class="rounded-xl border border-gray-200 bg-white p-3"><span class="app-lbl">Aanneemsom</span><b class="text-base text-navy-900" x-text="osFormat.euro(project.value)"></b></div>
                            <div class="rounded-xl border border-gray-200 bg-white p-3"><span class="app-lbl">Marge begroot</span><b class="text-base text-gray-700" x-text="project.margin_budgeted"></b></div>
                            <div class="rounded-xl border border-gray-200 bg-white p-3"><span class="app-lbl">Marge verwacht</span><b class="text-base" :class="project.margin_bad ? 'text-red-600' : 'text-green-700'" x-text="project.margin_expected"></b></div>
                            <div class="rounded-xl border border-gray-200 bg-white p-3"><span class="app-lbl">Urenfactor</span><b class="text-base text-navy-900" x-text="project.efficiency"></b><span class="block text-[11px] text-gray-500">boven één is meer uren dan begroot</span></div>
                        </div>
                        <button type="button" @click="$store.os.go(project.path)" class="app-btn mt-3 min-h-11 w-full"><span x-icon="'folder'" class="h-4 w-4"></span> Naar het project</button>
                    </div>
                </section>
            </template>
        </div>
    </div>
</template>
